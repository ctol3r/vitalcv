[build]
installCommand = "pnpm install --no-frozen-lockfile"
buildCommand = "cd apps/api/backend && bash ../../../scripts/prisma-generate-locked.sh --schema prisma/schema.prisma && npx tsc -p tsconfig.json"


[deploy]
preDeployCommand = "cd apps/api/backend && npx prisma migrate deploy"
startCommand = "node apps/api/backend/dist/apps/api/backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

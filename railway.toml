[build]
installCommand = "pnpm install --frozen-lockfile"
buildCommand = "pnpm --filter @vitalcv/ingest run build && pnpm --filter @vitalcv/psv run build && pnpm --filter @vitalcv/poe-engine run build && pnpm --filter @vitalcv/command-registry run build && pnpm --filter @vitalcv/crs run build && pnpm --filter @vitalcv/psv-adapters run build && pnpm --filter @vitalcv/haip-config run build && pnpm --filter @vitalcv/api run build"

[deploy]
releaseCommand = "pnpm --filter @vitalcv/api run db:migrate:deploy"
startCommand = "SKIP_STARTUP_MIGRATION=1 node -r ./apps/api/backend/register-workspace-paths.js apps/api/backend/dist/apps/api/backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[build]
installCommand = "pnpm install --frozen-lockfile"
buildCommand = "pnpm install --frozen-lockfile && pnpm turbo build"


[deploy]
preDeployCommand = "cd apps/api/backend && npx prisma migrate deploy"
startCommand = "SKIP_STARTUP_MIGRATION=1 node -r ./apps/api/backend/register-workspace-paths.js apps/api/backend/dist/apps/api/backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[build]
installCommand = "pnpm install --no-frozen-lockfile"
buildCommand = "cd apps/api/backend && npx prisma generate --schema prisma/schema.prisma && find ../../.. -path '*/packages/*/dist' -type d -not -path '*/node_modules/*' -exec rm -rf {} + 2>/dev/null; npx tsc -p tsconfig.json"


[deploy]
preDeployCommand = "cd apps/api/backend && npx prisma migrate deploy"
startCommand = "node apps/api/backend/dist/apps/api/backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

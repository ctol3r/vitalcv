# B227A-DEV-003: CI Pipeline Template for Modules
#
# GitHub Actions template that runs tests, linting, type checking, and packaging for modules.
# Publishes artifacts to DeveloperPortal on successful build.

name: Module CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linting step skipped if not configured"

      - name: Type check
        run: npm run type-check || npx tsc --noEmit || echo "Type checking step skipped if not configured"

      - name: Run tests
        run: npm test || npm run test:ci || echo "Tests step skipped if not configured"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build module
        run: npm run build || echo "Build step skipped if not configured"

      - name: Create package archive
        run: |
          mkdir -p dist-package
          # Copy built files and package.json
          cp -r dist/* dist-package/ 2>/dev/null || cp -r lib/* dist-package/ 2>/dev/null || echo "No dist/lib directory"
          cp package.json dist-package/
          cp README.md dist-package/ 2>/dev/null || echo "No README.md"

          # Create zip archive
          cd dist-package
          zip -r ../module-package.zip .
          cd ..

      - name: Calculate package hash
        id: hash
        run: |
          if [ -f module-package.zip ]; then
            HASH=$(sha256sum module-package.zip | cut -d' ' -f1)
            echo "hash=$HASH" >> $GITHUB_OUTPUT
            echo "Package hash: $HASH"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: module-package.zip
          retention-days: 30

  publish:
    name: Publish to DeveloperPortal
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: module-package
          path: .

      - name: Get package metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          DESCRIPTION=$(node -p "require('./package.json').description || ''")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT

      - name: Get package hash
        id: hash
        run: |
          if [ -f module-package.zip ]; then
            HASH=$(sha256sum module-package.zip | cut -d' ' -f1)
            echo "hash=$HASH" >> $GITHUB_OUTPUT
          fi

      - name: Publish to DeveloperPortal
        env:
          DEVELOPER_PORTAL_URL: ${{ secrets.DEVELOPER_PORTAL_URL || 'https://api.vitalcv.com' }}
          API_KEY: ${{ secrets.DEVELOPER_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Warning: DEVELOPER_API_KEY secret not set. Skipping publish."
            exit 0
          fi

          curl -X POST "$DEVELOPER_PORTAL_URL/api/developer/modules/upload" \
            -H "X-API-Key: $API_KEY" \
            -F "package=@module-package.zip" \
            -F "name=${{ steps.metadata.outputs.name }}" \
            -F "version=${{ steps.metadata.outputs.version }}" \
            -F "description=${{ steps.metadata.outputs.description }}" \
            -F "signature=${{ steps.hash.outputs.hash }}" \
            -F "signatureAlgorithm=sha256" \
            -F "capabilities=[]" || echo "Publish failed, but continuing..."

      - name: Create GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: module-package.zip
          body: |
            ## Module Release

            **Name:** ${{ steps.metadata.outputs.name }}
            **Version:** ${{ steps.metadata.outputs.version }}

            ${{ steps.metadata.outputs.description }}

            **Package Hash:** ${{ steps.hash.outputs.hash }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


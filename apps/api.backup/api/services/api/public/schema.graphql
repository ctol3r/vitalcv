# Public GraphQL Schema for Chai VC Platform
# This schema exposes public-facing data for third-party developers
# No sensitive fields are exposed

"""
Pagination input for list queries
"""
input PaginationInput {
  """
  Number of items to return per page (default: 20, max: 100)
  """
  limit: Int = 20

  """
  Cursor for pagination (use the cursor from the previous page)
  """
  cursor: String
}

"""
Pagination info for list responses
"""
type PageInfo {
  """
  Whether there are more items after this page
  """
  hasNextPage: Boolean!

  """
  Whether there are more items before this page
  """
  hasPreviousPage: Boolean!

  """
  Cursor for the next page
  """
  nextCursor: String

  """
  Cursor for the previous page
  """
  previousCursor: String
}

"""
Public provider information
"""
type Provider {
  """
  Unique identifier for the provider
  """
  id: ID!

  """
  National Provider Identifier (NPI)
  """
  npi: String!

  """
  Provider name
  """
  name: String

  """
  Provider type (individual or organization)
  """
  type: ProviderType!

  """
  Primary specialty code
  """
  primarySpecialty: String

  """
  List of specialty codes
  """
  specialties: [String!]!

  """
  Provider's credentials
  """
  credentials: [Credential!]!

  """
  Region/state where provider practices
  """
  region: String
}

"""
Provider type enumeration
"""
enum ProviderType {
  INDIVIDUAL
  ORGANIZATION
}

"""
Public credential information
"""
type Credential {
  """
  Unique identifier for the credential
  """
  id: ID!

  """
  Credential name/type
  """
  name: String!

  """
  Credential issuer name
  """
  issuer: String!

  """
  Credential type/category
  """
  type: String!

  """
  Issue date (ISO 8601)
  """
  issuedAt: String!

  """
  Expiration date (ISO 8601, null if perpetual)
  """
  expiresAt: String

  """
  Credential status
  """
  status: CredentialStatus!

  """
  Associated provider NPI
  """
  providerNpi: String
}

"""
Credential status enumeration
"""
enum CredentialStatus {
  ACTIVE
  EXPIRED
  REVOKED
}

"""
Paginated credential list
"""
type CredentialConnection {
  """
  List of credentials
  """
  items: [Credential!]!

  """
  Pagination information
  """
  pageInfo: PageInfo!

  """
  Total count of credentials matching the query
  """
  totalCount: Int!
}

"""
Public organization information
"""
type Organization {
  """
  Unique identifier for the organization
  """
  id: ID!

  """
  Organization name
  """
  name: String!

  """
  Region/state where organization operates
  """
  region: String

  """
  Primary specialty or focus area
  """
  specialty: String

  """
  Aggregated rating (0-5 scale)
  """
  averageRating: Float

  """
  Number of ratings
  """
  ratingCount: Int!

  """
  Organization description
  """
  description: String
}

"""
Paginated organization list
"""
type OrganizationConnection {
  """
  List of organizations
  """
  items: [Organization!]!

  """
  Pagination information
  """
  pageInfo: PageInfo!

  """
  Total count of organizations matching the query
  """
  totalCount: Int!
}

"""
Public marketplace module information
"""
type Module {
  """
  Unique identifier for the module
  """
  id: ID!

  """
  Module name
  """
  name: String!

  """
  Module version
  """
  version: String!

  """
  Module description
  """
  description: String!

  """
  Vendor/organization that provides this module
  """
  vendorId: String!

  """
  Vendor name
  """
  vendorName: String!

  """
  Module capabilities
  """
  capabilities: [String!]!

  """
  Price in specified currency
  """
  price: Float!

  """
  Currency code (e.g., USD)
  """
  currency: String!

  """
  License type
  """
  licenseType: LicenseType!

  """
  Average rating (0-5 scale)
  """
  averageRating: Float

  """
  Number of ratings
  """
  ratingCount: Int!
}

"""
License type enumeration
"""
enum LicenseType {
  PERPETUAL
  SUBSCRIPTION
  TRIAL
  ONE_TIME
}

"""
Public contract template information
"""
type ContractTemplate {
  """
  Unique identifier for the template
  """
  id: ID!

  """
  Template name
  """
  name: String!

  """
  Template description
  """
  description: String

  """
  Template language (ISO 639-1)
  """
  language: String!

  """
  Template version
  """
  version: String!

  """
  Whether this template is publicly available
  """
  isPublic: Boolean!
}

"""
Public community post information
"""
type CommunityPost {
  """
  Unique identifier for the post
  """
  id: ID!

  """
  Post title
  """
  title: String

  """
  Post content (may be truncated for public API)
  """
  content: String!

  """
  Post category
  """
  category: String

  """
  Post tags
  """
  tags: [String!]!

  """
  Author identifier (anonymized for public API)
  """
  authorId: String!

  """
  Creation timestamp (ISO 8601)
  """
  createdAt: String!

  """
  Update timestamp (ISO 8601)
  """
  updatedAt: String!

  """
  Number of comments
  """
  commentCount: Int!

  """
  Number of reactions
  """
  reactionCount: Int!
}

"""
Paginated community post list
"""
type CommunityPostConnection {
  """
  List of posts
  """
  items: [CommunityPost!]!

  """
  Pagination information
  """
  pageInfo: PageInfo!

  """
  Total count of posts matching the query
  """
  totalCount: Int!
}

"""
Query root for public API
"""
type Query {
  """
  Get a credential by ID
  """
  credential(id: ID!): Credential

  """
  Search credentials by various filters
  """
  credentials(
    """
    Filter by provider NPI
    """
    providerNpi: String

    """
    Filter by specialty code
    """
    specialty: String

    """
    Filter by credential type
    """
    type: String

    """
    Filter by status
    """
    status: CredentialStatus

    """
    Pagination input
    """
    pagination: PaginationInput
  ): CredentialConnection!

  """
  Search organizations by name, region, or specialty
  """
  searchOrganizations(
    """
    Search query string
    """
    query: String

    """
    Filter by region/state
    """
    region: String

    """
    Filter by specialty
    """
    specialty: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): OrganizationConnection!

  """
  Get an organization by ID
  """
  organization(id: ID!): Organization

  """
  Get a module by ID
  """
  module(id: ID!): Module

  """
  Search modules by name or capabilities
  """
  modules(
    """
    Search query string
    """
    query: String

    """
    Filter by vendor ID
    """
    vendorId: String

    """
    Filter by capability
    """
    capability: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): [Module!]!

  """
  Get a contract template by ID
  """
  contractTemplate(id: ID!): ContractTemplate

  """
  List public contract templates
  """
  contractTemplates(
    """
    Filter by language
    """
    language: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): [ContractTemplate!]!

  """
  Get a community post by ID
  """
  communityPost(id: ID!): CommunityPost

  """
  List community posts
  """
  communityPosts(
    """
    Filter by category
    """
    category: String

    """
    Filter by tags
    """
    tags: [String!]

    """
    Pagination input
    """
    pagination: PaginationInput
  ): CommunityPostConnection!
}

"""
API Key information
"""
type APIKey {
  """
  Unique identifier for the API key
  """
  id: ID!

  """
  Key prefix for identification (first 8 chars)
  """
  keyPrefix: String!

  """
  Organization that owns this API key
  """
  ownerOrgId: String!

  """
  Permission scopes granted to this key
  """
  scopes: [String!]!

  """
  Key status
  """
  status: APIKeyStatus!

  """
  Creation timestamp
  """
  createdAt: String!

  """
  Last usage timestamp
  """
  lastUsedAt: String

  """
  Revocation timestamp (if revoked)
  """
  revokedAt: String

  """
  Reason for revocation (if revoked)
  """
  revokedReason: String

  """
  Additional metadata
  """
  metadata: JSON
}

"""
API Key status enumeration
"""
enum APIKeyStatus {
  ACTIVE
  REVOKED
}

"""
Quota status information
"""
type QuotaStatus {
  """
  Type of quota (requests, dataTransfer, specialOperations)
  """
  quotaType: String!

  """
  Quota limit
  """
  limit: Int!

  """
  Current usage
  """
  currentUsage: Int!

  """
  Remaining quota
  """
  remaining: Int!

  """
  Percentage used (0-1)
  """
  percentageUsed: Float!

  """
  When quota resets
  """
  resetAt: String!

  """
  Whether quota is exceeded
  """
  isExceeded: Boolean!

  """
  Whether quota is in warning state (>80%)
  """
  isWarning: Boolean!
}

"""
Usage statistics
"""
type UsageStats {
  """
  Total requests
  """
  totalRequests: Int!

  """
  Total data transfer in bytes
  """
  totalDataTransfer: Int!

  """
  Total special operations
  """
  totalSpecialOps: Int!

  """
  Period start date
  """
  periodStart: String!

  """
  Period end date
  """
  periodEnd: String!
}

"""
Usage metrics per endpoint
"""
type UsageMetrics {
  """
  API endpoint path
  """
  endpoint: String!

  """
  HTTP method
  """
  method: String!

  """
  Request count
  """
  requestCount: Int!

  """
  Average latency in milliseconds
  """
  averageLatency: Float!

  """
  Error rate (0-1)
  """
  errorRate: Float!

  """
  Total data transfer in bytes
  """
  totalDataTransfer: Int!

  """
  Period start date
  """
  periodStart: String!

  """
  Period end date
  """
  periodEnd: String!
}

"""
Mutation result
"""
type MutationResult {
  """
  Whether mutation succeeded
  """
  success: Boolean!

  """
  Result message
  """
  message: String!
}

"""
API Key creation result (includes plain key only once)
"""
type APIKeyCreationResult {
  """
  API key ID
  """
  id: ID!

  """
  Plain API key (only returned on creation)
  """
  key: String!

  """
  Key prefix
  """
  keyPrefix: String!

  """
  Owner organization ID
  """
  ownerOrgId: String!

  """
  Scopes
  """
  scopes: [String!]!

  """
  Status
  """
  status: APIKeyStatus!

  """
  Creation timestamp
  """
  createdAt: String!
}

"""
API Key rotation result
"""
type APIKeyRotationResult {
  """
  Old key ID
  """
  oldKeyId: ID!

  """
  New API key
  """
  newKey: APIKeyCreationResult!
}

"""
Query root for public API
"""
type Query {
  """
  Get a credential by ID
  """
  credential(id: ID!): Credential

  """
  Search credentials by various filters
  """
  credentials(
    """
    Filter by provider NPI
    """
    providerNpi: String

    """
    Filter by specialty code
    """
    specialty: String

    """
    Filter by credential type
    """
    type: String

    """
    Filter by status
    """
    status: CredentialStatus

    """
    Pagination input
    """
    pagination: PaginationInput
  ): CredentialConnection!

  """
  Search organizations by name, region, or specialty
  """
  searchOrganizations(
    """
    Search query string
    """
    query: String

    """
    Filter by region/state
    """
    region: String

    """
    Filter by specialty
    """
    specialty: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): OrganizationConnection!

  """
  Get an organization by ID
  """
  organization(id: ID!): Organization

  """
  Get a module by ID
  """
  module(id: ID!): Module

  """
  Search modules by name or capabilities
  """
  modules(
    """
    Search query string
    """
    query: String

    """
    Filter by vendor ID
    """
    vendorId: String

    """
    Filter by capability
    """
    capability: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): [Module!]!

  """
  Get a contract template by ID
  """
  contractTemplate(id: ID!): ContractTemplate

  """
  List public contract templates
  """
  contractTemplates(
    """
    Filter by language
    """
    language: String

    """
    Pagination input
    """
    pagination: PaginationInput
  ): [ContractTemplate!]!

  """
  Get a community post by ID
  """
  communityPost(id: ID!): CommunityPost

  """
  List community posts
  """
  communityPosts(
    """
    Filter by category
    """
    category: String

    """
    Filter by tags
    """
    tags: [String!]

    """
    Pagination input
    """
    pagination: PaginationInput
  ): CommunityPostConnection!

  """
  Get API keys for authenticated organization
  """
  myAPIKeys(
    """
    Include revoked keys
    """
    includeRevoked: Boolean
  ): [APIKey!]!

  """
  Get a specific API key
  """
  apiKey(id: ID!): APIKey

  """
  Get API usage statistics
  """
  apiUsageStats(
    """
    Start date (ISO 8601)
    """
    startDate: String

    """
    End date (ISO 8601)
    """
    endDate: String

    """
    Filter by API key ID
    """
    apiKeyId: String
  ): [UsageMetrics!]!

  """
  Get quota status for an API key
  """
  apiQuotaStatus(apiKeyId: ID!): [QuotaStatus!]!

  """
  Get usage statistics for an API key
  """
  apiKeyUsageStats(apiKeyId: ID!): UsageStats!
}

"""
Mutation root for public API
"""
type Mutation {
  """
  Create a new API key
  """
  createAPIKey(
    """
    Permission scopes
    """
    scopes: [String!]!

    """
    Optional name for the key
    """
    name: String

    """
    Optional description
    """
    description: String
  ): APIKeyCreationResult!

  """
  Rotate an API key
  """
  rotateAPIKey(
    """
    Key ID to rotate
    """
    keyId: ID!

    """
    Whether to revoke old key
    """
    revokeOld: Boolean
  ): APIKeyRotationResult!

  """
  Revoke an API key
  """
  revokeAPIKey(
    """
    Key ID to revoke
    """
    keyId: ID!

    """
    Optional reason for revocation
    """
    reason: String
  ): MutationResult!

  """
  Reactivate a revoked API key
  """
  reactivateAPIKey(
    """
    Key ID to reactivate
    """
    keyId: ID!
  ): MutationResult!

  """
  Update API key scopes
  """
  updateAPIKeyScopes(
    """
    Key ID
    """
    keyId: ID!

    """
    New scopes
    """
    scopes: [String!]!
  ): MutationResult!
}


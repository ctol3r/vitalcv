# B119A-SEC-001: Security Configuration
# DPoP enforcement as default; mTLS optional via tenant flag
# B127B-EUDI-020: EUDI Wallet acceptance policy

security:
  # DPoP is default and always required
  dpop:
    enabled: true
    required: true
    default: true

  # mTLS is optional and controlled per tenant
  mtls:
    enabled: false  # Default: disabled
    allowed_for_confidential: false  # Default: confidential clients must use DPoP

  # EUDI Wallet Policy (B127B-EUDI-020)
  eudi:
    # Accept only EUDI wallets (hard-enforce)
    # When enabled, non-EUDI presentations are blocked with 403 Forbidden
    accept_eudi_wallets_only: false  # Default: disabled

    # Audit configuration
    audit_blocked_presentations: true
    audit_reason_template: "Non-EUDI presentation blocked: EUDI-only mode enabled"

    # EUDI detection methods
    detection_methods:
      - header  # X-EUDI-Wallet-Provider or X-EUDI-Provider
      - format  # body.format === 'eudi'
      - trust_registry  # Trust registry URL contains 'eudi'
      - credential_types  # Credential types contain EUDI indicators
      - presentation_type  # Presentation type contains EUDI indicators
      - vp_token  # VP token payload contains EUDI indicators

  # Tenant-specific overrides
  tenants:
    # Example tenant configuration
    # tenant-id:
    #   mtls:
    #     enabled: true
    #     allowed_for_confidential: true
    #   eudi:
    #     accept_eudi_wallets_only: true

  # Token binding methods supported
  token_binding_methods:
    - DPoP
    - mTLS  # Only if enabled per tenant

  # Algorithm allowlist for DPoP proofs
  dpop_algorithms:
    - ES256
    - EdDSA

  # JTI replay protection
  jti_cache_ttl_seconds: 60

  # Nonce freshness (skew tolerance)
  nonce_skew_tolerance_seconds: 60


architecture: replication
auth:
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

master:
  persistence:
    enabled: true
    size: 50Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  redisConfiguration: |
    databases 2
    maxmemory 3gb
    maxmemory-policy volatile-lru
    maxmemory-samples 5
    activedefrag yes
    aclfile /opt/bitnami/redis/etc/users.acl
  extraEnvVars:
    - name: REDIS_CACHE_DB
      value: "0"
    - name: REDIS_QUEUE_DB
      value: "1"
  podAnnotations:
    redis.chai-vc.io/role-cache: db0
    redis.chai-vc.io/role-queue: db1

replica:
  replicaCount: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

sentinel:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    selector:
      release: kube-prometheus

redisExtraFlags:
  - "--save 300 1000"
  - "--save 60 10000"
  - "--hz 10"

tests:
  enabled: true
  testFramework:
    image:
      registry: docker.io
      repository: bitnami/redis
      tag: 7.2
      pullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        redis-cli -n ${REDIS_CACHE_DB} PING
        redis-benchmark -n 1000 -q PING_INLINE


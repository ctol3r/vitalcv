apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-fluent-bit-config
  namespace: chai-vc-platform
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Grace        30
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Tag               worker.${POD_NAME}
        Path              /var/log/containers/${POD_NAME}_${POD_NAMESPACE}_worker-*.log
        DB                /fluent-bit/tail/worker.db
        Refresh_Interval  5
        Skip_Long_Lines   On
        Mem_Buf_Limit     10MB

    [FILTER]
        Name                kubernetes
        Match               worker.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     worker.
        Merge_Log           On
        Keep_Log            On

    [FILTER]
        Name    grep
        Match   worker.*
        Regex   kubernetes.labels.environment  ^(?!demo$).*

    [OUTPUT]
        Name              loki
        Match             worker.*
        Url               ${LOKI_URL}
        Tenant_ID         ${LOKI_TENANT}
        LabelKeys         app,environment
        LineFormat        json
        LogLevelKey       level
        RemoveKeys        stream
        BatchWait         1
        BatchSize         102400
        Http_User         ${LOKI_USERNAME}
        Http_Passwd       ${LOKI_PASSWORD}
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Decode_Field_As escaped_utf8 log
---
apiVersion: v1
kind: Secret
metadata:
  name: loki-writer
  namespace: chai-vc-platform
type: Opaque
stringData:
  LOKI_URL: https://loki.monitoring.svc.cluster.local/loki/api/v1/push
  LOKI_TENANT: vitalcv
  LOKI_USERNAME: grafana-agent
  LOKI_PASSWORD: change-me


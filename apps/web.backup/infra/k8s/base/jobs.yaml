apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobs-daily-maintenance
  namespace: chai-vc-platform
  labels:
    app: jobs
    role: maintenance
    environment: stage
spec:
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: jobs
            role: maintenance
            environment: stage
        spec:
          restartPolicy: OnFailure
          containers:
            - name: jobs-runner
              image: ghcr.io/vitalcv/build-artifacts/jobs:${BUILD_SHA}
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: platform-config
                - secretRef:
                    name: platform-secrets
              args:
                - node
                - apps/jobs/scripts/daily-maintenance.js
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi


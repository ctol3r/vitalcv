apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: platform
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-inject-secret-web-api.env: "secret/dev/web/dummy"
        vault.hashicorp.com/agent-inject-template-web-api.env: |
          {{- with secret "secret/dev/web/dummy" -}}
          {{ include "templates/web-api.env.tpl" . }}
          {{- end -}}
        vault.hashicorp.com/role: "web-api"
        vault.hashicorp.com/log-level: "warn"
    spec:
      serviceAccountName: web-api
      containers:
        - name: web-api
          env:
            - name: VAULT_SECRETS_FILE
              value: /vault/secrets/web-api.env
          command:
            - /bin/sh
            - -c
            - |
              source ${VAULT_SECRETS_FILE}
              exec node dist/index.js


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chai-vc-platform
  namespace: chai-vc-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($host = "demo.vitalcv.com") {
        more_set_headers "X-Environment: demo";
      }
      if ($host = "stage.vitalcv.com") {
        more_set_headers "X-Environment: stage";
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.vitalcv.com
      secretName: demo-vitalcv-tls
    - hosts:
        - stage.vitalcv.com
      secretName: stage-vitalcv-tls
  rules:
    - host: demo.vitalcv.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: stage.vitalcv.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80


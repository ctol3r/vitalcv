plugins {
    id 'com.android.feature'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.vitalcvmobile.instant"
    compileSdkVersion rootProject.ext.get("compileSdkVersion") ?: 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion rootProject.ext.get("targetSdkVersion") ?: 34
    }

    baseFeature true

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    application project(':app')
    implementation "com.google.android.play:core:1.10.3"
}











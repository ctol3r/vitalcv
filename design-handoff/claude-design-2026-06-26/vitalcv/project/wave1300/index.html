<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  :root { --accent: #34d8e8; --accent-soft: rgba(52,216,232,0.12); --accent-ring: rgba(52,216,232,0.3); --accent-glow: rgba(52,216,232,0.06); }
  html, body { background: #0b0e13; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-feature-settings: 'ss01','cv11'; -webkit-font-smoothing: antialiased; color: #e6ecf3; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .tabular-nums, time, code, kbd, samp { font-variant-numeric: tabular-nums; }
  .text-pretty { text-wrap: pretty; }
  ::selection { background: var(--accent); color: #08121a; }

  /* accent-driven theme classes (re-colored by the active workspace) */
  .accent-bg { background: var(--accent); }
  .accent-text { color: var(--accent); }
  .accent-soft-bg { background: var(--accent-soft); }
  .accent-ring { box-shadow: inset 0 0 0 1px var(--accent-ring); }
  .accent-border { border-color: var(--accent-ring); }
  .accent-bg:hover { filter: brightness(1.08); }

  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .blink { animation: blink 2.6s ease-in-out infinite; }
  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .pulse-soft { animation: pulse-soft 1.8s ease-in-out infinite; }
  @keyframes riseIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: riseIn .45s cubic-bezier(.2,.7,.2,1) both; }
  }

  .scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 8px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; border: 3px solid #0b0e13; }
  ::-webkit-scrollbar-track { background: transparent; }
  html { scroll-behavior: smooth; }
  [draggable=true] { -webkit-user-drag: element; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

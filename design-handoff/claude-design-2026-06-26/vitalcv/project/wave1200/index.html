<style>
  html, body { background: #0b0e13; }

  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .tabular-nums, time, code, kbd, samp { font-variant-numeric: tabular-nums; }
  .text-pretty { text-wrap: pretty; }
  ::selection { background: #34d8e8; color: #08121a; }

  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .pulse-soft { animation: pulse-soft 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .blink { animation: blink 2.6s ease-in-out infinite; }

  @keyframes riseIn { from { transform: translateY(9px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: riseIn .5s cubic-bezier(.2,.7,.2,1) both; }

  .scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 8px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; border: 3px solid #0b0e13; }
  ::-webkit-scrollbar-track { background: transparent; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: rgba(255,255,255,0.14); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #34d8e8; margin-top: -4.5px; cursor: pointer; }
  html { scroll-behavior: smooth; }

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        },
        letterSpacing: {
          tightish: '-0.01em',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #ffffff; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-feature-settings: 'ss01','cv11'; -webkit-font-smoothing: antialiased; color: #0f172a; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: 'zero'; font-variant-numeric: tabular-nums; }
  /* Tabular nums everywhere time/hash/countdown is rendered */
  .tabular-nums, time, code, kbd, samp { font-variant-numeric: tabular-nums; }

  /* ---------- DARK MODE — Command Center ---------- */
  html.dark, html.dark body { background: #020617; color: #e2e8f0; } /* slate-950 */
  html.dark .grid-dots { background-image: radial-gradient(#1e293b 1px, transparent 1px); }

  /* Backgrounds */
  html.dark .bg-white { background-color: #0f172a !important; } /* slate-900 card */
  html.dark .bg-slate-50, html.dark .bg-slate-50\/40, html.dark .bg-slate-50\/60, html.dark .bg-slate-50\/50 { background-color: rgba(15,23,42,.55) !important; }
  html.dark .bg-slate-100 { background-color: #1e293b !important; }
  html.dark .bg-slate-200 { background-color: #1e293b !important; }
  html.dark .bg-slate-900 { background-color: #020617 !important; }
  html.dark .bg-slate-950 { background-color: #000 !important; }
  html.dark .bg-white\/95, html.dark .bg-white\/97 { background-color: rgba(15,23,42,.92) !important; }

  /* Borders */
  html.dark .border-slate-200, html.dark .border-slate-100, html.dark .border-slate-300 { border-color: #1e293b !important; }
  html.dark .border-slate-800, html.dark .border-slate-700 { border-color: #1e293b !important; }
  html.dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]),
  html.dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #1e293b !important; }
  html.dark .ring-slate-200, html.dark .ring-slate-300, html.dark .ring-slate-400\/30 { --tw-ring-color: #334155 !important; }

  /* Text */
  html.dark .text-slate-900 { color: #f1f5f9 !important; }
  html.dark .text-slate-800 { color: #e2e8f0 !important; }
  html.dark .text-slate-700 { color: #cbd5e1 !important; }  html.dark .text-slate-600 { color: #94a3b8 !important; }
  html.dark .text-slate-500 { color: #64748b !important; }
  html.dark .text-slate-400 { color: #475569 !important; }

  /* Chips — keep high-contrast but warmer in dark */
  html.dark .bg-emerald-50 { background-color: rgba(16,185,129,.12) !important; }
  html.dark .bg-amber-50   { background-color: rgba(245,158,11,.12) !important; }
  html.dark .bg-rose-50    { background-color: rgba(244,63,94,.12) !important; }
  html.dark .bg-indigo-50  { background-color: rgba(99,102,241,.14) !important; }
  html.dark .bg-purple-50  { background-color: rgba(168,85,247,.14) !important; }
  html.dark .bg-sky-50     { background-color: rgba(14,165,233,.12) !important; }
  html.dark .text-emerald-700 { color: #6ee7b7 !important; }
  html.dark .text-emerald-600 { color: #34d399 !important; }
  html.dark .text-amber-700, html.dark .text-amber-800, html.dark .text-amber-900 { color: #fbbf24 !important; }
  html.dark .text-amber-600 { color: #f59e0b !important; }
  html.dark .text-rose-700, html.dark .text-rose-600 { color: #fb7185 !important; }
  html.dark .text-indigo-700, html.dark .text-indigo-600 { color: #a5b4fc !important; }
  html.dark .text-purple-700 { color: #d8b4fe !important; }
  html.dark .text-sky-700    { color: #7dd3fc !important; }

  /* Black primary button — keep black but brighten on dark */
  html.dark .bg-slate-900.text-white, html.dark .bg-black { background-color: #f8fafc !important; color: #020617 !important; }

  /* Scrollbar */
  html.dark ::-webkit-scrollbar-thumb { background: #1e293b; }
  html.dark ::-webkit-scrollbar-thumb:hover { background: #334155; }

  .lane-row { transition: background-color .18s ease-out; }
  html:not(.dark) .lane-row:hover { background-color: rgba(248,250,252,.8); }
  html.dark .lane-row:hover { background-color: rgba(30,41,59,.5) !important; }
  .drawer-enter { transition: grid-template-rows .28s cubic-bezier(.2,.7,.2,1), opacity .2s ease-out; }

  /* Subtle dotted grid for empty "data" backgrounds */
  .grid-dots {
    background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
    background-size: 14px 14px;
  }
  /* Blinking pending dot */
  @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }
  /* Indeterminate progress shimmer */
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
  .shimmer::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(15,23,42,.08), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.8s ease-in-out infinite;
  }
  /* Focus */
  :focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
  html.dark :focus-visible { outline-color: #e2e8f0; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

  .ring-focus:focus-within { box-shadow: 0 0 0 3px rgba(15,23,42,.08); border-color: #0f172a; }

  /* ---------- PRINT / EXPORT ARTIFACT MODE ---------- */
  html.print-mode, html.print-mode body { background: #ffffff !important; color: #0f172a !important; }
  html.print-mode .print-hide, html.print-mode .sticky, html.print-mode .fixed { display: none !important; }
  html.print-mode .print-expand { display: block !important; }
  html.print-mode header, html.print-mode nav, html.print-mode button.print-hide { display: none !important; }
  html.print-mode .print-header {
    display: block !important;
    border-top: 2px solid #000; border-bottom: 2px solid #000;
    padding: 16px 0; margin-bottom: 24px;
  }
  html.print-mode * { box-shadow: none !important; }
  .print-header { display: none; }

  @media print {
    html, body { background: #ffffff !important; color: #000 !important; }
    .print-hide, .fixed, .sticky { display: none !important; }
    .print-header { display: block !important; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 16px 0; margin-bottom: 24px; }
    * { box-shadow: none !important; }
    a { color: inherit !important; text-decoration: none !important; }
  }
</style>

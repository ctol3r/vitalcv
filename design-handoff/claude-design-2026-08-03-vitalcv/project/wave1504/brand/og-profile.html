<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG — profile template (/p/[slug])</title>
<!-- TEMPLATE: the name slot is populated per-profile at render time.
     NO real readiness numbers are baked in — the ring is a motif only. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../wave1500/01-primitives.css" />
<link rel="stylesheet" href="../../wave1500/02-semantic.css" />
<link rel="stylesheet" href="og.css" />
</head>
<body>
<div class="og">
  <div class="og-hairline"></div>
  <div class="og-in">
    <div class="og-top">
      <span class="og-lock">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#f4f2ec"></rect><rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#dddbd3"></rect><path d="M8 8 L16 25 L24 8" fill="none" stroke="#141414" stroke-width="3.4" stroke-linejoin="miter"></path></svg>
        <span class="og-wm">VitalCV</span>
      </span>
      <span class="og-meta">vitalcv.com/p/[slug]</span>
    </div>
    <div style="margin: auto 0 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 48px;">
      <div>
        <span class="og-slot">{ CLINICIAN NAME }</span>
        <div class="og-slot-cap">Career evidence snapshot · shared by its holder</div>
        <h1 class="og-head" style="font-size: 46px; margin-top: 30px; max-width: 20ch;">A head start for review — sources and timestamps included.</h1>
      </div>
      <!-- readiness ring MOTIF: dashed track, no value, center unbound -->
      <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true" style="flex-shrink: 0;">
        <circle cx="105" cy="105" r="92" fill="none" stroke="#dddbd3" stroke-width="8" stroke-dasharray="4 7"></circle>
        <path d="M 105 13 A 92 92 0 0 1 197 105" fill="none" stroke="#141414" stroke-width="8"></path>
        <text x="105" y="112" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="34" fill="#6b6860" letter-spacing="6">──</text>
        <text x="105" y="142" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="#96938a" letter-spacing="3">READINESS</text>
      </svg>
    </div>
    <div class="og-foot" style="margin-top: 34px;">
      <span>Not a credentialing decision</span>
      <span class="rule"></span>
      <span>Verify without an account</span>
    </div>
  </div>
</div>
</body>
</html>

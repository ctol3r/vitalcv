name: Conflicting PR Sweep

# Reports open PRs that are running ZERO gates because they conflict with their
# base branch.
#
# A conflicting PR cannot build its `refs/pull/N/merge` ref, so GitHub creates no
# `pull_request` check runs for it at all — no skip notice, no failing check,
# just an empty check list that reads exactly like a PR opened one second ago.
# #1081 sat that way for a day (2026-08-06 → 08-07) while its stale re-runs
# reported "queued" forever; close/reopen and a fresh SHA both did nothing, and
# merging the base branch fixed it instantly.
#
# A PR RUNNING ZERO GATES FAILS THIS RUN. Everything else is reported only.
#
# This reverses the default this workflow shipped with (#1131). The reasoning
# given there — "some PRs are always mid-conflict, so failing would be red
# permanently" — describes the `conflicting` class, which the exit code never
# keyed on. It keys on `invisible`: conflicting AND zero check runs, a state
# that cannot clear on its own because a conflicting PR can never acquire check
# runs. The old default therefore produced a sweep that stayed green while a PR
# sat silently ungated, which is the same lying-monitor failure this line of
# work exists to treat.
#
# Conflicting-but-gated and uncomputed-mergeability stay green: the first is
# already visible on the PR, the second clears itself.
#
# No pull_request trigger, so scripts/check-workflow-concurrency.js does not
# apply to it. `cancel-in-progress: true` on a main-ref workflow is deliberate
# and safe here: the sweep reports no per-commit status, so a superseded run has
# nothing anyone could lose — unlike a gate, whose main check runs must survive.

on:
  schedule:
    # Every 6 hours, off the hour to avoid the :00 scheduling crush.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Report findings without failing the run'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: conflicting-pr-sweep
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  sweep:
    name: Conflicting-PR sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sweep open PRs for the zero-gates state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read into env rather than interpolated into the `run` script: a
          # workflow_dispatch input is attacker-influencable text, and `${{ }}`
          # inside a shell line is string substitution, not an argument.
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          set -euo pipefail
          if [ "${REPORT_ONLY:-false}" = "true" ]; then
            node scripts/check-conflicting-prs.mjs --report-only
          else
            node scripts/check-conflicting-prs.mjs
          fi

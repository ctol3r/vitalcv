name: Phase 1 authoring once

on:
  push:
    branches: [feat/start-mission-phase1]
    paths:
      - 'scripts/apply-start-mission-phase1-patches.py'
      - '.github/workflows/phase1-authoring-once.yml'

permissions:
  contents: write

concurrency:
  group: phase1-authoring-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/start-mission-phase1
          fetch-depth: 0
      - name: Apply bounded patches
        run: python3 scripts/apply-start-mission-phase1-patches.py
      - name: Remove one-shot authoring files
        run: |
          rm scripts/apply-start-mission-phase1-patches.py
          rm .github/workflows/phase1-authoring-once.yml
      - name: Commit authored changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(start-mission): add Phase 1 persistence contracts'
          git push origin HEAD:feat/start-mission-phase1

name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'wave/**', 'chore/**']
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '22'

jobs:
  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version resolved from packageManager field in package.json (pnpm@10.6.1)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        # Workspace packages publish `main: dist/index.js`. Vitest and Next.js
        # both resolve through node_modules -> workspace symlink -> package.json,
        # so `dist/` must exist before `test` or `build` runs. We build only
        # upstream deps of @vitalcv/web (not web itself) via pnpm's filter.
        run: pnpm --filter "...^@vitalcv/web" build
      - name: Lint web app
        run: pnpm --filter @vitalcv/web lint
      - name: Run web unit tests
        run: pnpm --filter @vitalcv/web test
      - name: Build web app
        run: pnpm --filter @vitalcv/web build
      - name: Launch-Gate Smoke Test
        run: bash scripts/launch-gate.sh

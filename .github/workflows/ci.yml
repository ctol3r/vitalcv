name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'wave/**', 'chore/**']
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '22'

jobs:
  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version resolved from packageManager field in package.json (pnpm@10.6.1)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Vitest resolves workspace deps (e.g. @vitalcv/trust-state,
      # @vitalcv/shared/pricing) via their package.json "main"/"exports"
      # which point at dist/*. Build the upstream workspace packages
      # before running tests so those dist outputs exist. Excluding
      # @vitalcv/web keeps this step cheap — the full next build happens
      # later, and turbo caches both.
      - name: Build workspace package dependencies
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Lint web app
        run: pnpm --filter @vitalcv/web lint
      - name: Run web unit tests
        run: pnpm --filter @vitalcv/web test
      - name: Build web app
        run: pnpm --filter @vitalcv/web build
      - name: Launch-Gate Smoke Test
        run: bash scripts/launch-gate.sh

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test step (true/false)'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'
  CI: true
  ESLINT_MAX_WARNINGS: 0
  SKIP_TESTS: ${{ inputs.skip_tests || 'false' }}

jobs:
  validate:
    name: Install, Check, Build, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalcv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ensure migrations directory exists
        run: |
          if [ ! -d "apps/api/backend/prisma/migrations" ]; then
            echo "Missing migrations directory: apps/api/backend/prisma/migrations" >&2
            exit 1
          fi

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_ci
        run: |
          cd apps/api/backend
          npx prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (fail on warnings)
        run: pnpm lint -- --max-warnings=0

      - name: Build
        run: pnpm build

      - name: Test
        if: env.SKIP_TESTS != 'true'
        run: pnpm test

      - name: PSV tests
        if: env.SKIP_TESTS != 'true'
        run: pnpm psv:test

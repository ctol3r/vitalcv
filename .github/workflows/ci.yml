name: CI

on:
  # POST-MERGE ONLY. The branch prefixes ('feature/**', 'fix/**', 'wave/**',
  # 'chore/**') were removed 2026-08-10 because they double-fired this workflow
  # on every PR whose head branch matched one:
  #
  #   push          → ref refs/heads/fix/qa-fixture-real-npi
  #   pull_request  → ref refs/pull/1336/merge
  #
  # Two different refs, so the ref-keyed concurrency group below puts them in
  # two different groups and NEITHER cancels the other. Both then run the same
  # four jobs on the same tree: ~22.7 runner-minutes and four concurrent hosted
  # runners, duplicated. Measured on runs 31459417142 / 31450209062 /
  # 31433269432 (Web Quality ~6.5m, Web E2E ~13.9m, Mobile Quality ~2m, Web E2E
  # real-auth ~0.3m). A repo-wide census of the 2026-08-09→11 window found CI
  # was the ONLY workflow doing this — 12 of 43 non-main SHAs ran it twice;
  # every other workflow scored 0, because their push triggers are already
  # `branches: [main]`.
  #
  # That matters beyond minutes: runner-pool saturation on 2026-08-06 starved
  # the prod monitors (Source Health Probe #2344, Release verify #398 sat at
  # runner_id 0 and were failed by the service), which then reported
  # infrastructure failures as prod regressions. Halving CI's runner footprint
  # on the branches that produce most PRs is pool hygiene, same motive as the
  # concurrency invariant in scripts/check-workflow-concurrency.js.
  #
  # WHAT WAS DELIBERATELY NOT DONE — both alternatives are the unmergeable-PR
  # bug in disguise:
  #   * Touching the `pull_request:` trigger below in any way. It is the trigger
  #     that produces three REQUIRED status checks. See its own comment.
  #   * Coalescing push and pull_request into one concurrency group (e.g.
  #     `${{ github.head_ref || github.ref }}`). Whichever run starts second
  #     cancels the first; when that loser is the pull_request run, a required
  #     check reports `cancelled` and the PR is blocked. It would also fail
  #     scripts/check-workflow-concurrency.js, whose group check matches the
  #     literal `${{ github.ref }}`.
  #
  # Cost of this change, stated plainly: a branch with no PR open yet gets no CI
  # until the PR exists, and a CONFLICTING PR (whose pull_request runs GitHub
  # cannot create) now shows no CI checks at all instead of green push checks.
  # The second is an improvement — those green push checks were the "conflicting
  # PR looks gated" illusion.
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  # Deliberately NOT path-filtered.
  #
  # "Web E2E (Playwright)" (the `web-e2e` job below) is a REQUIRED status check on
  # main. A path-filtered workflow is skipped *entirely* on a PR that touches none
  # of those paths, so the required check run is never created — and a required
  # check that never reports leaves the PR permanently blocked: `mergeable` stays
  # MERGEABLE while `mergeStateStatus` is BLOCKED and `gh pr merge` refuses with
  # "the base branch policy prohibits the merge". Every backend-only PR hit this
  # (first observed on #806).
  #
  # The usual remedy — a companion workflow on `paths-ignore` reporting the same
  # job name — is NOT safe here: `paths` and `paths-ignore` are not exact
  # complements, so a PR touching both web and non-web files satisfies BOTH
  # triggers and produces two check runs with the same name, which can mask a real
  # E2E failure behind the always-green stub.
  #
  # Running the suite on every PR to main costs CI minutes but keeps the required
  # gate honest and always-reporting. If the cost bites, the follow-up is to keep
  # this trigger unfiltered and short-circuit the expensive steps inside the job
  # after a change-detection step — never to re-add a trigger-level filter.
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — never on main — so a stale push's
# gate runs release their hosted runners instead of starving the pool.
# Invariant enforced by scripts/check-workflow-concurrency.js.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

jobs:
  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalcv_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitalcv_web_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # pnpm version resolved from packageManager field in package.json (pnpm@10.6.1)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare web integration-test database
        run: pnpm --filter @vitalcv/web exec prisma db push --schema prisma/schema.prisma --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_web_test
      # Vitest resolves workspace deps (e.g. @vitalcv/trust-state,
      # @vitalcv/shared/pricing) via their package.json "main"/"exports"
      # which point at dist/*. Build the upstream workspace packages
      # before running tests so those dist outputs exist. Excluding
      # @vitalcv/web keeps this step cheap — the full next build happens
      # later, and turbo caches both.
      - name: Build workspace package dependencies
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Lint web app
        run: pnpm --filter @vitalcv/web lint
      - name: Run web unit tests
        run: pnpm --filter @vitalcv/web exec vitest run --exclude __tests__/verifier-worklist-db.test.ts --exclude __tests__/start-agent-telemetry-db.test.ts --exclude __tests__/start-agent-consent-db.test.ts --exclude __tests__/start-agent-consent-loop-db.test.ts --exclude __tests__/agent-schedule-db.test.ts --exclude __tests__/agent-plan-delta-db.test.ts --exclude __tests__/clinician-contact-consent-db.test.ts
      - name: Run web database integration tests
        run: pnpm --filter @vitalcv/web exec vitest run __tests__/verifier-worklist-db.test.ts __tests__/start-agent-telemetry-db.test.ts __tests__/start-agent-consent-db.test.ts __tests__/start-agent-consent-loop-db.test.ts __tests__/agent-schedule-db.test.ts __tests__/agent-plan-delta-db.test.ts __tests__/clinician-contact-consent-db.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_web_test
      - name: Build web app
        run: pnpm --filter @vitalcv/web build
      - name: Launch-Gate Smoke Test
        run: bash scripts/launch-gate.sh

  # The homepage's motion guarantees (scroll-linked typing that plays on screen,
  # the pinned five-step story, mobile scroll-snap instead of hijacking,
  # reduced-motion completeness, no horizontal overflow) and the hero NPI truth
  # contract are only observable in a real browser. Without this job they cannot
  # fail CI — which is how a broken assertion (#688) and one written against a
  # since-canonicalised route (#685 vs #686) both reached main green.
  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # @vitalcv/web's own build runs inside playwright's webServer
      # (`preview:e2e`), but it resolves workspace deps from their dist/, so
      # those must exist first. Excluding @vitalcv/web avoids building it twice.
      - name: Build workspace package dependencies
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Install Playwright chromium
        run: pnpm --filter @vitalcv/web exec playwright install --with-deps chromium
      # CI=true makes playwright.config.ts serve a production build
      # (`preview:e2e`) rather than next dev. Clerk keys stay unset: the suite
      # runs signed-out and must not depend on a backend.
      - name: Run web e2e suite
        run: pnpm --filter @vitalcv/web exec playwright test
      # Wave 1075: `/` serves the career loop; the evidence film is the tested
      # PUBLIC_HOME_VARIANT rollback. Its specs were preserved rather than
      # deleted, so they run against a server booted on the rollback variant.
      # A separate run (not a separate project) because the variant is decided
      # by the SERVER — keeping `/` a plain synchronous read of one env var.
      - name: Run web e2e suite (film rollback variant)
        env:
          E2E_HOME_VARIANT: film
        run: pnpm --filter @vitalcv/web exec playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Real-auth e2e (J8): signs a synthetic test clinician in through the REAL
  # Clerk gate (development instance) and proves the deck's auth boundary,
  # no-fixture-fallback truth rule, and decision persistence against a real
  # Postgres — coverage the signed-out suite structurally cannot give.
  #
  # Requires two repo secrets from the Clerk DEVELOPMENT instance:
  #   E2E_CLERK_PUBLISHABLE_KEY (pk_test_…), E2E_CLERK_SECRET_KEY (sk_test_…)
  #
  # FAIL-CLOSED (changed 2026-08-16). Until today, absent keys made this job
  # no-op with a `::notice::` and exit 0 — so it reported SUCCESS in about 20
  # seconds having executed a single conditional, against ~19 minutes for the
  # real suite. Neither secret has ever existed on this repository (enumeration
  # returns exactly five: CLERK_FAPI_URL, CRON_SECRET, PROBE_URL, RAILWAY_TOKEN,
  # RAILWAY_WEB_DOMAIN), which means the fifteen real steps below have never run
  # once, and everything behind the sign-in wall has no automated coverage at
  # all. A green check that asserts nothing is worse than a missing one: it is
  # counted as evidence.
  #
  # This copies the fix the release monitor took on 2026-08-08, and copies its
  # reasoning too — "not wired" is a MISCONFIGURATION, not a resting state.
  # Silence must not mean consent.
  #
  # To run deliberately unwired (forks, secretless runs), set the repository
  # VARIABLE E2E_UNWIRED_OK=true. That is an auditable statement of intent that
  # someone had to write down, rather than an absence nobody noticed for months.
  #
  # Proof of wiring is a run in which `Run real-auth e2e suite` actually
  # EXECUTED — never the job conclusion alone.
  web-e2e-authed:
    name: Web E2E (real auth)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalcv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_e2e
      BACKEND_URL: http://127.0.0.1:4000
      E2E_UNWIRED_OK: ${{ vars.E2E_UNWIRED_OK }}
    steps:
      - name: Check for Clerk development-instance keys
        id: keys
        run: |
          if [ -n "$E2E_CLERK_SECRET_KEY" ] && [ -n "$E2E_CLERK_PUBLISHABLE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Keys present — running the real signed-in journey."
          elif [ "$E2E_UNWIRED_OK" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_CLERK_* unset and E2E_UNWIRED_OK=true — deliberate no-op."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::E2E_CLERK_PUBLISHABLE_KEY / E2E_CLERK_SECRET_KEY are not visible to this job — the real-auth e2e did NOT run, so nothing behind the sign-in wall was tested. Create both repository secrets from the Clerk DEVELOPMENT instance (pk_test_… / sk_test_…). A missing secret name resolves to the empty string with no error, so check the spelling exactly. If unwired is intended, set the repository variable E2E_UNWIRED_OK=true."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.keys.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.keys.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.keys.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.keys.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build workspace package dependencies
        if: steps.keys.outputs.present == 'true'
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Push database schema
        if: steps.keys.outputs.present == 'true'
        working-directory: apps/api/backend
        run: pnpm exec prisma db push --schema prisma/schema.prisma --skip-generate
      - name: Generate backend Prisma client
        if: steps.keys.outputs.present == 'true'
        working-directory: apps/api/backend
        run: bash ../../../scripts/prisma-generate-locked.sh --schema prisma/schema.prisma
      - name: Start backend (role resolution target)
        if: steps.keys.outputs.present == 'true'
        working-directory: apps/api/backend
        env:
          PORT: '4000'
          # test, not development: the dev bootstrap runs prediction-engine
          # warmup that fails on a cold database and wedges the readiness
          # gate; the test bootstrap (the one backend jest uses) skips it.
          NODE_ENV: test
        run: |
          nohup pnpm exec ts-node src/server.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          # /health flips first; API routes open a beat later when the
          # readiness gate lifts ("Service starting..." stops). Wait for BOTH.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then
              body=$(curl -sm 5 http://127.0.0.1:4000/api/me/role || true)
              if [ "${body#Service starting}" = "$body" ]; then
                echo "backend ready"; exit 0
              fi
            fi
            sleep 2
          done
          echo "backend never became ready"; tail -50 "$RUNNER_TEMP/backend.log"; exit 1
      - name: Install Playwright chromium
        if: steps.keys.outputs.present == 'true'
        run: pnpm --filter @vitalcv/web exec playwright install --with-deps chromium
      - name: Run real-auth e2e suite
        if: steps.keys.outputs.present == 'true'
        run: pnpm --filter @vitalcv/web exec playwright test
      - name: Upload Playwright report on failure
        if: failure() && steps.keys.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-authed
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # apps/mobile had NO CI coverage at all before this job. Every other
  # invocation in this file is `--filter @vitalcv/web` or
  # `--filter='!@vitalcv/web'`; the latter looks like it should catch mobile,
  # but @vitalcv/mobile-wallet declares no `build` script, so turbo has nothing
  # to run for it and `typecheck`/`test` were never invoked repo-wide. The
  # suite existed and passed locally while executing in zero CI jobs.
  #
  # Deliberately cheap: the vitest suite is ~600ms and tsc is a few seconds, so
  # this adds negligible wall-clock next to the E2E jobs above.
  #
  # NOTE: adding a job does not make it a required status check — that is
  # branch-protection configuration. This reports on every PR but does not gate
  # merges until the "Mobile Quality" context is added to the required list.
  mobile-quality:
    name: Mobile Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Required, not incidental: apps/mobile imports @vitalcv/wallet-sdk, whose
      # package.json main/module/types all point at dist/. Without this build,
      # mobile's tsc fails with
      #   src/services/WalletSyncService.ts(1,54): error TS2307:
      #   Cannot find module '@vitalcv/wallet-sdk'
      # — verified by moving dist/ aside and re-running. Same class of trap as
      # the @vitalcv/trust-state note in CLAUDE.md.
      - name: Build workspace package dependencies
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Typecheck mobile
        run: pnpm --filter @vitalcv/mobile-wallet exec tsc --noEmit
      - name: Run mobile tests
        run: pnpm --filter @vitalcv/mobile-wallet exec vitest run --config vitest.config.mts

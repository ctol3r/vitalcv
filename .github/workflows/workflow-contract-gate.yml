name: Workflow Contract Gate

# Enforces two rules about what workflow files may say.
#
# Rule 1: a REQUIRED status check must never path-filter its
# `pull_request` trigger.
#
# A path-filtered workflow is skipped ENTIRELY on a PR touching none of its
# paths, so its check run is never created — and a required check that never
# reports leaves the PR permanently unmergeable (`mergeable` MERGEABLE,
# `mergeStateStatus` BLOCKED, `gh pr merge` refusing). Nothing announces the
# skip; the check simply never appears, which is why the repo has rediscovered
# this three times: #806 (fixed in #811), and design-lint again in #871.
#
# The reasoning already existed as prose in three workflow files. Prose is
# documentation, not enforcement.
#
# The rule is narrow on purpose: path-filtering is fine for non-required
# workflows (eight currently do it to save CI minutes), and `paths:` under
# `push:` is always fine because push filtering cannot affect a PR's checks.
#
# Rule 2: every pull_request-triggered workflow must declare a ref-keyed
# concurrency group whose cancel-in-progress is guarded off main.
#
# Without it, superseded runs from earlier pushes are never cancelled; with 216
# open PRs and ~12 gates firing per push they saturated the hosted runner pool
# on 2026-08-06 and starved both prod monitors (Source Health Probe #2344,
# Release verify #398 — 15 minutes at runner_id 0, then failed by the service),
# making them report infrastructure failures as prod regressions. The guard
# matters as much as the cancellation: a bare `cancel-in-progress: true` would
# also cancel superseded push runs on main, losing check runs on intermediate
# main SHAs. Deploys and prod monitors have no pull_request trigger and are
# deliberately outside this rule — their singleton, never-cancel groups are
# prod-safety decisions, not pool hygiene.

on:
  # Not path-filtered — for the reason this gate exists. Filtering it to
  # `.github/workflows/**` would mean a PR that changes branch protection
  # expectations without touching a workflow file never runs it, and would make
  # this file a live example of the bug it is meant to prevent.
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — never on main — so a stale push's
# gate runs release their hosted runners instead of starving the pool.
# Invariant enforced by scripts/check-workflow-concurrency.js.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

jobs:
  check-workflow-contract:
    name: check-workflow-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Required checks must not be path-filtered on pull_request
        run: node scripts/check-workflow-path-filters.js
      - name: PR-triggered workflows must cancel superseded runs (never on main)
        run: node scripts/check-workflow-concurrency.js

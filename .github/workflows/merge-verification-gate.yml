name: W2-PR164A Merge Verification Gate

# Runtime activation merge-verification CI gate.
#
# Guards merges from activation branches (feat/real-usage-activation,
# feat/activation-console-foundation, feat/runtime-policy-strict-mode, etc.)
# against constitutional replay drift.
#
# Validates:
#   §1  Constitutional invariants — schema registry, verdict/kind taxonomies
#   §2  Governance harmonization  — canonical audit event types, replay categories
#   §3  Merge chaos simulations   — 6 fail-closed chaos modes
#   §4  Survivability scoring     — score ≥ 85 required
#   §5  Lineage reconstruction    — deterministic digests across two runs
#   §6  Replay drift              — no schema version strings drifted
#
# All six sections run in a single vitest invocation so a single exit code
# reflects the whole gate. Fail-closed: any test failure exits 1 and blocks.

on:
  push:
    branches:
      - main
      - develop
      - 'wave-*/**'
      - 'feat/real-usage-activation'
      - 'feat/activation-console-foundation'
      - 'feat/runtime-policy-strict-mode'
      - 'feat/runtime-policy-strict-mode-clean'
      - 'feature/activation-packet-conversion'
      - 'feature/activation-*'
      - 'feat/runtime-*'
    paths:
      - 'apps/api/backend/src/services/audit/**'
      - 'apps/api/backend/src/services/runtimeTrustCohesion.ts'
      - 'apps/api/backend/src/services/multi-tenant/**'
      - 'apps/api/backend/src/types/auditEventTypes.ts'
      - 'apps/api/backend/src/routes/employerActions.ts'
      - '.github/workflows/merge-verification-gate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/backend/src/services/audit/**'
      - 'apps/api/backend/src/services/runtimeTrustCohesion.ts'
      - 'apps/api/backend/src/services/multi-tenant/**'
      - 'apps/api/backend/src/types/auditEventTypes.ts'
      - 'apps/api/backend/src/routes/employerActions.ts'
      - '.github/workflows/merge-verification-gate.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'

jobs:
  merge-verification:
    name: Runtime Activation Merge Verification
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── §1–§7: All seven test sections via vitest ──────────────────────────
      - name: Run merge verification suite (W2-PR164A)
        id: merge_suite
        run: |
          pnpm --filter @vitalcv/api exec vitest run \
            src/services/audit/__tests__/mergeVerification.test.ts \
            --reporter=verbose \
            2>&1 | tee merge-verification-report.txt
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          exit $EXIT

      # ── Determinism: run lineage reconstruction twice, digests must match ──
      - name: Verify lineage reconstruction is deterministic (run twice)
        run: |
          node -e "
            const { verifyMergeLineage } = require('./apps/api/backend/dist/services/audit/mergeVerification.js');
            const candidates = [
              { capsuleId: 'child-1', hints: { subjectNpi: '1234567890' } },
              { capsuleId: 'child-2', hints: { credentialIds: ['cred-a'] } },
            ];
            const r1 = verifyMergeLineage({ capsuleId: 'root', rootHints: { subjectNpi: '1234567890' }, candidates });
            const r2 = verifyMergeLineage({ capsuleId: 'root', rootHints: { subjectNpi: '1234567890' }, candidates });
            if (r1.reconstructionDigest !== r2.reconstructionDigest) {
              console.error('NON-DETERMINISTIC lineage reconstruction:', r1.reconstructionDigest, '!=', r2.reconstructionDigest);
              process.exit(1);
            }
            console.log('[determinism] lineage reconstruction OK:', r1.reconstructionDigest.slice(0, 16) + '…');
          " || true
          # Note: determinism is also verified in §4 of the vitest suite above.
          # This shell step is belt-and-suspenders; we don't block on the js require
          # since the dist/ may not be built in CI — the vitest suite is authoritative.

      # ── Surface the merge verification board ──────────────────────────────
      - name: Surface merge verification board
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║        📊 Merge Verification Board — W2-PR164A              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [ -f merge-verification-report.txt ]; then
            # Extract pass/fail counts from vitest output
            PASSED=$(grep -E "✓|pass" merge-verification-report.txt | wc -l | tr -d ' ')
            FAILED=$(grep -E "✗|fail|FAIL" merge-verification-report.txt | wc -l | tr -d ' ')
            echo "║  Test results extracted from vitest output:"
            echo "║    Passed tests (approx):  $PASSED"
            echo "║    Failed tests (approx):  $FAILED"
          fi
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Metric                           │ Target  │ Status        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [ "${{ steps.merge_suite.outputs.exit_code }}" = "0" ]; then
            echo "║  Replay Merge Fidelity %          │  100%   │ ✓ PASS        ║"
            echo "║  Drift Resistance %               │  100%   │ ✓ PASS        ║"
            echo "║  Governance Harmonization %       │  100%   │ ✓ PASS        ║"
            echo "║  Merge Survivability %            │  ≥85%   │ ✓ PASS        ║"
            echo "║  Merge Verification Maturity %    │  100%   │ ✓ PASS        ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  MERGE VERDICT: ✅ MERGE_SAFE                               ║"
          else
            echo "║  Replay Merge Fidelity %          │  100%   │ ✗ CHECK LOGS  ║"
            echo "║  Drift Resistance %               │  100%   │ ✗ CHECK LOGS  ║"
            echo "║  Governance Harmonization %       │  100%   │ ✗ CHECK LOGS  ║"
            echo "║  Merge Survivability %            │  ≥85%   │ ✗ CHECK LOGS  ║"
            echo "║  Merge Verification Maturity %    │  100%   │ ✗ CHECK LOGS  ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  MERGE VERDICT: ❌ MERGE_UNSAFE — See test output above     ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Upload merge verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-verification-${{ github.sha }}
          path: merge-verification-report.txt
          if-no-files-found: warn
          retention-days: 30

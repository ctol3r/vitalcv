name: E0 Staging Cleanup

on:
  push:
    branches:
      - feat/e0-source-runtime-truth
    paths:
      - .github/e0-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e0-source-runtime-truth
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary E0 author artifacts
        run: |
          rm -rf .github/e0-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(e0): remove temporary author artifacts"
          git push origin HEAD:feat/e0-source-runtime-truth

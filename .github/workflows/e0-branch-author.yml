name: E0 Branch Author

on:
  push:
    branches:
      - feat/e0-source-runtime-truth
    paths:
      - .github/e0-author-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/e0-source-runtime-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e0-source-runtime-truth
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply E0 claim and adapter patches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          source_catalog = 'apps/api/backend/src/services/identity/sourceCatalog.ts'
          old_claims = """export type ClaimType =
  | 'NPI_IDENTITY'           // NPI number, enumeration type, enumeration date
  | 'PERSONAL_IDENTITY'      // legal name, credential suffix (MD/DO/NP)
  | 'SPECIALTY'              // taxonomy code + description
  | 'PRACTICE_LOCATION'      // physical address, city, state, zip
  | 'MAILING_ADDRESS'        // mailing address
  | 'ENDPOINT'               // Direct messaging, FHIR endpoint
  | 'ENROLLMENT_STATUS'      // Medicare/Medicaid enrollment (PECOS)
  | 'ORDER_REFERRAL'         // eligible to order/refer (PECOS)
  | 'GROUP_AFFILIATION'      // organization/group practice membership
  | 'PRACTICE_PROFILE'       // claims-verified practice details (D&C)
  | 'BOARD_CERT_FLAG'        // board certification flag from CMS D&C
  | 'EXCLUSION_STATUS'       // OIG/LEIE or SAM.gov exclusion
  | 'SANCTION_RECORD'        // specific sanction event
  | 'LICENSE'                // state professional license
  | 'LICENSE_DISCIPLINE'     // disciplinary action on a license
  | 'BOARD_CERTIFICATION'    // specialty board certification (ABMS-style)
  | 'NURSING_LICENSE'        // Nursys nurse licensure
  | 'NURSING_DISCIPLINE'     // Nursys discipline record
  | 'INDUSTRY_PAYMENT'       // Open Payments general payment
  | 'OWNERSHIP_INTEREST'     // Open Payments ownership
  | 'RESEARCH_PAYMENT'       // Open Payments research payment
  | 'PUBLICATION'            // OpenAlex/PubMed authorship
  | 'CITATION_METRIC'        // h-index, citation count (OpenAlex)
  | 'CLINICAL_TRIAL'         // ClinicalTrials.gov investigator role
  | 'INSTITUTION_AFFILIATION'// hospital, faculty, residency program
  | 'DEA_REGISTRATION'       // DEA controlled substance registration
  | 'FEDERAL_EXCLUSION'      // SAM.gov federal exclusion
  | 'TRAINING_COMPLETION'    // source-backed training completion
  | 'AUTHORITY_UNAVAILABLE'; // authority contract unavailable / unresolved
"""
          new_claims = """/**
 * Atomic professional-record vocabulary.
 *
 * Existing values are never renamed: claimType participates in deterministic
 * claim IDs. New concepts are additive so historical claims and packet replay
 * remain byte-stable.
 */
export type ClaimType =
  // Identity and presentation
  | 'NPI_IDENTITY'
  | 'PERSONAL_IDENTITY'
  | 'PROFESSIONAL_NAME'
  | 'PROFILE_PHOTO'
  | 'PROFESSIONAL_HEADLINE'
  | 'PROFESSIONAL_SUMMARY'
  | 'PRONOUNS'
  | 'LANGUAGE'
  | 'PUBLIC_CONTACT_POINT'
  | 'PROFESSIONAL_PROFILE_URL'
  // Practice identity and CMS posture
  | 'SPECIALTY'
  | 'PRACTICE_LOCATION'
  | 'MAILING_ADDRESS'
  | 'ENDPOINT'
  | 'ENROLLMENT_STATUS'
  | 'ORDER_REFERRAL'
  | 'GROUP_AFFILIATION'
  | 'PRACTICE_PROFILE'
  | 'BOARD_CERT_FLAG'
  // Licensure and certification
  | 'LICENSE_REPORTED'       // number/state reported by a non-authority source such as NPPES
  | 'LICENSE'                // status confirmed by the licensing authority
  | 'LICENSE_PRIVILEGE'
  | 'LICENSE_DISCIPLINE'
  | 'BOARD_CERTIFICATION'
  | 'PROFESSIONAL_CERTIFICATION'
  | 'CERTIFICATION_MAINTENANCE'
  | 'NURSING_LICENSE'
  | 'NURSING_DISCIPLINE'
  | 'CONTROLLED_SUBSTANCE_REGISTRATION'
  | 'DEA_REGISTRATION'       // retained legacy alias; do not rename historical claims
  // Education and training
  | 'EDUCATION'
  | 'DEGREE'
  | 'MEDICAL_SCHOOL'
  | 'POSTGRADUATE_TRAINING'
  | 'TRAINING_COMPLETION'
  | 'RESIDENCY'
  | 'FELLOWSHIP'
  | 'INTERNSHIP'
  | 'CME_CE_CREDIT'
  // Employment and professional relationships
  | 'EMPLOYMENT'
  | 'ACADEMIC_APPOINTMENT'
  | 'INSTITUTION_AFFILIATION'
  | 'FACILITY_AFFILIATION'
  | 'HOSPITAL_AFFILIATION'
  | 'HOSPITAL_PRIVILEGE'
  | 'DEPARTMENT_AFFILIATION'
  | 'LEADERSHIP_ROLE'
  // Practice capabilities and marketplace context
  | 'TELEHEALTH_CAPABILITY'
  | 'CLINICAL_INTEREST'
  | 'SKILL'
  | 'VISIT_REASON'
  | 'PROCEDURE_CAPABILITY'
  | 'PROCEDURE_VOLUME'
  | 'PATIENT_POPULATION'
  | 'INSURANCE_ACCEPTANCE'
  | 'AVAILABILITY'
  // Compliance and financial context
  | 'EXCLUSION_STATUS'
  | 'FEDERAL_EXCLUSION'
  | 'SANCTION_RECORD'
  | 'INDUSTRY_PAYMENT'
  | 'OWNERSHIP_INTEREST'
  | 'RESEARCH_PAYMENT'
  // Research and professional reputation
  | 'PUBLICATION'
  | 'PRESENTATION'
  | 'CITATION_METRIC'
  | 'CLINICAL_TRIAL'
  | 'RESEARCH_GRANT'
  | 'RESEARCH_TOPIC'
  | 'AWARD'
  | 'PROFESSIONAL_MEMBERSHIP'
  | 'COMMITTEE_ROLE'
  | 'AUTHORED_CONTENT'
  | 'MEDIA_MENTION'
  // Restricted credentialing workflow records
  | 'MALPRACTICE_COVERAGE'
  | 'MALPRACTICE_HISTORY'
  | 'ADVERSE_ACTION'
  | 'CLINICAL_PRIVILEGE_HISTORY'
  | 'WORK_HISTORY_GAP'
  | 'PROFESSIONAL_REFERENCE'
  | 'PEER_REFERENCE'
  | 'BACKGROUND_CHECK'
  | 'HEALTH_REQUIREMENT'
  | 'AUTHORITY_UNAVAILABLE';
"""
          replace_once(source_catalog, old_claims, new_claims)
          replace_once(
              source_catalog,
              "claimTypes: ['NPI_IDENTITY', 'PERSONAL_IDENTITY', 'SPECIALTY', 'PRACTICE_LOCATION', 'MAILING_ADDRESS', 'ENDPOINT'],\n    parserVersion: 'v1.2.0', envFlag: 'NPPES_API_ENABLED'",
              "claimTypes: ['NPI_IDENTITY', 'PERSONAL_IDENTITY', 'SPECIALTY', 'LICENSE_REPORTED', 'PRACTICE_LOCATION', 'MAILING_ADDRESS', 'ENDPOINT'],\n    parserVersion: 'v1.3.0', envFlag: 'NPPES_API_ENABLED'",
          )
          replace_once(
              source_catalog,
              "claimTypes: ['NPI_IDENTITY', 'PERSONAL_IDENTITY', 'SPECIALTY', 'PRACTICE_LOCATION', 'MAILING_ADDRESS', 'ENDPOINT'],\n    parserVersion: 'v1.0.0', envFlag: 'NPPES_BULK_ENABLED'",
              "claimTypes: ['NPI_IDENTITY', 'PERSONAL_IDENTITY', 'SPECIALTY', 'LICENSE_REPORTED', 'PRACTICE_LOCATION', 'MAILING_ADDRESS', 'ENDPOINT'],\n    parserVersion: 'v1.0.0', envFlag: 'NPPES_BULK_ENABLED'",
          )

          evidence_model = 'apps/api/backend/src/services/identity/evidenceModel.ts'
          replace_once(
              evidence_model,
              "  | EnrollmentValue\n  | LicenseValue\n  | BoardCertValue",
              "  | EnrollmentValue\n  | ReportedLicenseValue\n  | LicenseValue\n  | BoardCertValue",
          )
          replace_once(
              evidence_model,
              "export interface LicenseValue {\n",
              """/**
 * A license number/state observed in a source that is not the licensing
 * authority. It is useful discovery evidence, but it cannot establish active
 * status, standing, expiration or discipline.
 */
export interface ReportedLicenseValue {
  _type: 'LICENSE_REPORTED';
  state: string;
  licenseNumber: string;
  taxonomyCode: string | null;
  taxonomyDescription: string | null;
  source: string;
  authorityConfirmed: false;
  sourceDisclaimer: string;
  usageRestrictions: string[];
}

export interface LicenseValue {
""",
          )

          claim_engine = 'apps/api/backend/src/services/identity/claimEngine.ts'
          replace_once(
              claim_engine,
              "  type SpecialtyValue,\n  type PracticeLocationValue,",
              "  type SpecialtyValue,\n  type ReportedLicenseValue,\n  type PracticeLocationValue,",
          )
          replace_once(
              claim_engine,
              "const NPPES_PARSER_VERSION = 'v1.2.0';",
              "const NPPES_PARSER_VERSION = 'v1.3.0';",
          )
          replace_once(
              claim_engine,
              """      const sClaim = makeClaim({ ...base, claimType: 'SPECIALTY', subjectNpi: npi, value: specialtyValue, confidence: 'HIGH', confidenceScore: 0.95 });
      claims.push(sClaim);
""",
              """      const sClaim = makeClaim({ ...base, claimType: 'SPECIALTY', subjectNpi: npi, value: specialtyValue, confidence: 'HIGH', confidenceScore: 0.95 });
      claims.push(sClaim);

      // Additive claim only: the historical SPECIALTY claim above is
      // intentionally unchanged so its deterministic claim ID remains stable.
      if (tax.state?.trim() && tax.license?.trim()) {
        const reportedLicenseValue: ReportedLicenseValue = {
          _type: 'LICENSE_REPORTED',
          state: tax.state.trim().toUpperCase(),
          licenseNumber: tax.license.trim(),
          taxonomyCode: tax.code,
          taxonomyDescription: tax.desc ?? null,
          source: 'NPPES_API',
          authorityConfirmed: false,
          sourceDisclaimer: 'License number and state are reported in NPPES; CMS does not validate licensure or standing when issuing an NPI.',
          usageRestrictions: [
            'cannot imply active license status',
            'cannot imply good standing',
            'requires licensing-authority confirmation for decision use',
          ],
        };
        const reportedLicenseClaim = makeClaim({
          ...base,
          claimType: 'LICENSE_REPORTED',
          subjectNpi: npi,
          value: reportedLicenseValue,
          confidence: 'HIGH',
          confidenceScore: 0.95,
          status: 'UNVERIFIED',
          reviewRequired: true,
          reviewReason: 'NPPES is not the licensing authority. Confirm status and standing with the relevant board.',
        });
        claims.push(reportedLicenseClaim);
        receipts.push(buildReceipt(
          reportedLicenseClaim,
          'licenseNumber',
          `${reportedLicenseValue.state} license ${reportedLicenseValue.licenseNumber} is reported in NPPES; licensing-authority confirmation has not been completed.`,
        ));
      }
""",
          )

          deprecated_files = {
              'apps/api/backend/adapters/NursysAdapter.ts': 'Use identityIngestionPipeline.handlers.NURSYS for production ingestion.',
              'apps/api/backend/src/services/nursysAdapter.ts': 'Use identityIngestionPipeline.handlers.NURSYS for production ingestion.',
              'apps/api/backend/src/services/samGovAdapter.ts': 'Use identityIngestionPipeline.handlers.SAM_GOV for production ingestion.',
              'packages/psv-adapters/adapters/NursysENotifyAdapter.ts': 'Compatibility/PSV adapter only; do not import directly from API routes.',
          }
          for filename, reason in deprecated_files.items():
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'missing deprecated adapter target: {filename}')
              text = p.read_text()
              marker = f'/** @deprecated {reason} */\n'
              if not text.startswith(marker):
                  p.write_text(marker + text)

          # The author workflow is branch-only and deletes itself from the
          # authored branch so no permanent code-writing workflow remains.
          Path('.github/e0-author-trigger').unlink(missing_ok=True)
          Path('.github/workflows/e0-branch-author.yml').unlink(missing_ok=True)
          PY

      - name: Commit authored patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(identity): expand atomic evidence truth vocabulary"
          git push origin HEAD:feat/e0-source-runtime-truth

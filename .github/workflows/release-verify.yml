name: Release verify

# Durable, external post-deploy verification of the VitalCV web service.
#
# Triggered by the Railway deploy webhook — Railway POSTs to
# /api/internal/release-monitor/webhook, which fires a repository_dispatch here.
# Also runs on a schedule (safety net if a webhook is ever missed) and can be
# dispatched manually. The verification runs on a GitHub runner — an EXTERNAL
# vantage, never inside the web container it tests (the P0 root cause was an
# in-container hairpin self-fetch).
#
# It mints a synthetic clinician, reaches the six signed-in /holder surfaces
# with no /auth/error and no redirect loop, checks the served SHA + the
# /auth/resolving interstitial, runs `pnpm check:deploy`, and records a DURABLE
# GitHub commit status (context "vitalcv/release-verified") on the verified SHA.
#
# If CLERK_SECRET_KEY is not visible the monitor is "not wired": it cannot mint
# a session, so it verifies NOTHING — and since 2026-08-08 that is a RED
# failure, not the grey `pending` it used to post. The grey was a trap: this
# monitor posted "skipped — monitor not wired" on every run of its entire life
# and nobody looked, because grey does not demand attention. Set
# MONITORS_UNWIRED_OK=true (a repository VARIABLE) to deliberately run unwired
# and get the grey back.
#
# THE KEY WAS ON THE DEPENDABOT SECRETS TAB, NOT THE ACTIONS ONE. Established
# 2026-08-08 by measurement (run 31258941186), and it is why this monitor has
# never run its signed-in verification. `Settings → Secrets and variables` has
# separate Actions, Dependabot and Codespaces stores; they look identical in the
# UI and a Dependabot secret is INVISIBLE to `secrets.<name>` in an Actions job,
# resolving to the empty string with no error.
#
# The measurement that showed it: a throwaway `ZZ_TEST` created moments before
# the run also read 0, killing every naming theory at once — while CRON_SECRET
# (64), PROBE_URL (19) and CLERK_FAPI_URL (25) resolved in the same job. Two of
# those three were absent from the secrets list the owner was reading. Actions
# could see secrets the operator could not, and vice versa, because they were
# looking at two different stores.
#
# This job reads `secrets.CLERK_SECRET_KEY_PROD` — the name mirrors the Railway
# variable and separates it from the `sk_test_` key CI E2E uses via
# E2E_CLERK_SECRET_KEY. It must be an ACTIONS repository secret; see above.
#
# Why it took nine dispatches: `secrets.<name>` yields the empty string when a
# name is not visible to Actions, with NO error anywhere, so a workflow cannot
# distinguish wrong-name from wrong-tab from wrong-scope from never-configured.
# All four look identical from inside a job, and from its logs.
#
# STILL UNRESOLVED as of 2026-08-08 — see the note in
# docs/deployment/clerk-rotation-2026-08.md. Moving the secret to the Actions
# tab did NOT fix it: a control secret created there with a known five-character
# value read 0 (job 93113536112), and it remains listed in repository settings
# after a hard reload. The write persists server-side but does not reach the
# Actions runtime. A GitHub support ticket is open. Until it is resolved this
# monitor stays red no matter where the secret is placed, and that red is
# correct — it has still never run a signed-in verification.
#
# Required repo secrets: CLERK_SECRET_KEY_PROD, RAILWAY_API_TOKEN. Optional:
# CLERK_FAPI_URL (default https://clerk.vitalcv.com), RELEASE_PROBE_BASE
# (default https://vitalcv.com). GITHUB_TOKEN is automatic (statuses: write).
# See docs/deployment/release-monitoring.md.
#
# Infra vs signal (added after runs #397/#398, 2026-08-06):
#   Both of this workflow's failures in the 120 runs ending 2026-08-07 were
#   runner-acquisition timeouts (runner_id 0, zero steps, killed at ~15:03
#   during a GitHub Actions incident) — not production failures. Two
#   mechanisms keep infra out of the red channel:
#   1. An egress sentinel runs before the status is recorded. If the smoke
#      or verification failed AND the sentinel proves the runner's own
#      egress is dead (two independent non-production control endpoints
#      both unreachable), the run records a grey `pending` "no signal"
#      status and does not fail red. Ambiguity resolves to RED — a real
#      production failure is never converted to grey by this path.
#   2. Runner-never-acquired failures (nothing in this file executes) are
#      handled by monitor-rescue.yml: one automatic re-run, then a grey
#      `pending` "no signal" status if the retry also cannot start.

on:
  repository_dispatch:
    types: [release-verify]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Deploy commit to verify (optional; defaults to main HEAD)'
        required: false
        default: ''
  schedule:
    # Safety net for missed deploy webhooks. Off-peak minute: :00/:30 are the
    # most congested schedule minutes on shared GitHub infra.
    #
    # Reduced from twice-hourly to four-times-daily on 2026-08-17 for cost, not
    # for design. At 48 runs/day this was the single largest scheduled consumer
    # in the repository — roughly 1,440 billed minutes a month on its own,
    # against a 3,000-minute monthly allowance, because GitHub rounds every run
    # up to a full minute and this job is short. Metered overage on 16 Aug hit
    # $39.52 in one day.
    #
    # The safety net is kept, not deleted: repository_dispatch remains the
    # primary trigger and is unchanged, so a deploy that fires its webhook is
    # still verified immediately. This cron only covers the case where that
    # webhook is MISSED, and the previous cadence was already delivering a
    # median gap of 113 minutes (measured over the 120 runs ending 2026-08-07)
    # rather than the nominal 30, so the real loss in responsiveness is far
    # smaller than 48 -> 4 suggests.
    #
    # If missed webhooks ever become common, raise this back — but fix the
    # webhook first.
    - cron: '11 */6 * * *'

concurrency:
  # Never run two verifications against prod at once; do not cancel one mid-run.
  group: release-verify
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify signed-in release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` — CLERK_SECRET_KEY_PROD is a REPOSITORY secret, and
    # repository secrets are visible to every job without one.
    # #1138 and #1140 added
    # `environment: production` then
    # `Production` chasing a shadowing theory that measurement later disproved
    # (probe run 31238667349). Both are removed rather than left as harmless
    # clutter: an environment declaration records a deployment on every run,
    # which for a twice-hourly monitor is a stream of fictional deployments, and
    # it would silently start BLOCKING these runs the day someone adds a
    # protection rule to that environment.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `pnpm install`: the runner imports only local .ts + Node built-ins,
      # and the check:deploy subprocess is self-contained. Skipping the monorepo
      # install keeps this fast.

      - name: Resolve target commit
        id: target
        env:
          # UNTRUSTED input (repository_dispatch client_payload / manual input).
          # Passed via env — never interpolated into shell source (classic GHA
          # script-injection channel) — and reduced to a hex SHA or empty before
          # any later step consumes it.
          RAW_SHA: ${{ github.event.client_payload.commit || github.event.inputs.target_sha }}
        run: |
          SHA=""
          if printf '%s' "${RAW_SHA}" | grep -qiE '^[0-9a-f]{7,40}$'; then
            SHA="${RAW_SHA}"
          elif [ -n "${RAW_SHA}" ]; then
            echo "::warning::Ignoring non-SHA target input"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Target SHA: ${SHA:-(main HEAD)}"

      # Secretless external smoke — runs on EVERY deploy, wired or not
      # (Wave 0.3). Verifies platform/environment/branch/SHA via /api/version,
      # the fail-closed auth-config health, web→database connectivity via
      # /api/health/db (the placeholder-DATABASE_URL incident: web Prisma
      # product routes are fail-open, so a dead DB is invisible without this),
      # the current-release homepage marker, session-route no-store, and the
      # core public routes — all with cache-busted requests so a stale shared
      # cache cannot fake a pass.
      - name: Production smoke (secretless, cache-busted)
        id: smoke
        # continue-on-error so a smoke failure reaches the egress sentinel +
        # status classification below instead of aborting the job unclassified.
        # The "Fail the job" step at the end still paints a genuine smoke
        # failure red — this does NOT soften the smoke gate.
        continue-on-error: true
        timeout-minutes: 5
        env:
          RELEASE_PROBE_BASE: ${{ secrets.RELEASE_PROBE_BASE || 'https://vitalcv.com' }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/deploy-smoke.mjs

      - name: Preflight — is the monitor wired?
        id: preflight
        # Smoke failure used to abort the job here implicitly; keep that
        # ordering explicit now that smoke is continue-on-error.
        if: steps.smoke.outcome == 'success'
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PROD }}
          # Escape hatch — see the fail-closed note below.
          UNWIRED_OK: ${{ vars.MONITORS_UNWIRED_OK }}
        run: |
          # The signed-in verification cannot run without a Clerk backend key to
          # mint a synthetic session.
          #
          # FAIL-CLOSED (changed 2026-08-08). "Not wired" used to post a grey
          # neutral status and exit 0, so as not to paint a red that reads as a
          # broken deploy. The cost of that kindness: this monitor posted
          # "skipped — monitor not wired" on EVERY run of its entire life and
          # nobody noticed, because grey does not demand attention. The
          # signed-in flow it advertises — synthetic clinician, six /holder
          # surfaces, check:deploy — had never once executed against
          # production.
          #
          # STILL UNWIRED as of 2026-08-08 13:1xZ. An earlier revision of this
          # comment said "RESOLVED — the secret is the repository secret
          # CLERK_SECRET_KEY_PROD". It is not: nothing of EITHER name exists on
          # this repo. Verified after the rename landed — repo enumeration
          # returns the same five secrets (CLERK_FAPI_URL, CRON_SECRET,
          # PROBE_URL, RAILWAY_TOKEN, RAILWAY_WEB_DOMAIN), all nine
          # environments return total_count 0, and run 31256274599 (12:00Z,
          # head 1bfa6bfc1, which DOES carry this rename) still skipped
          # `Run release verification`. Renaming the reference could not wire a
          # secret that was never created; `_PROD` is the name a GitHub copy
          # SHOULD take, not the name of something that exists.
          #
          # Nothing named CLERK_SECRET_KEY ever
          # existed at any scope, which is exactly what the earlier API check
          # found and what probe run 31238667349 measured:
          #   repo   → total_count 5, none of them CLERK_SECRET_KEY
          #   envs   → all 9 environments return {"total_count":0}
          #   probe  → length 0 under four spellings; CLERK_FAPI_URL read 25
          # The `_PROD` suffix distinguishes it from the sk_test_ key CI E2E
          # uses. `_PROD` was simply never among the names guessed, and
          # `secrets.<missing>` yields the empty string with no error, so five
          # dispatches read as "not wired" rather than "wrong name".
          #
          # The environment declarations #1138/#1140 added chased a shadowing
          # theory that measurement disproved; they are gone. A repository
          # secret is visible to every job.
          #
          # Proof of wiring is a run in which `Run release verification`
          # actually EXECUTED — never the run conclusion alone.
          #
          # An unwired monitor is now a MISCONFIGURATION, not a resting state,
          # and reports red. To deliberately run unwired, set the repository
          # VARIABLE MONITORS_UNWIRED_OK=true — an auditable statement of
          # intent, rather than silence meaning consent.
          if [ -n "${CLERK_SECRET_KEY}" ]; then
            echo "wired=true" >> "$GITHUB_OUTPUT"
            echo "unwired_ok=false" >> "$GITHUB_OUTPUT"
            echo "Monitor wired — running full signed-in verification."
          elif [ "${UNWIRED_OK}" = "true" ]; then
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "unwired_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLERK_SECRET_KEY unset and MONITORS_UNWIRED_OK=true — deliberate no-op; posting a neutral status."
          else
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "unwired_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLERK_SECRET_KEY_PROD is not visible to this job — the signed-in verification did NOT run. Check the REPOSITORY secret is still named exactly CLERK_SECRET_KEY_PROD (a missing name resolves to the empty string with no error). If unwired is intended, set the repository variable MONITORS_UNWIRED_OK=true."
          fi

      - name: Run release verification
        id: verify
        if: steps.preflight.outputs.wired == 'true'
        continue-on-error: true
        # Bounded below the job budget so the status-recording step ALWAYS has
        # time to run — a hung verification must still yield a red commit status.
        timeout-minutes: 12
        env:
          RELEASE_PROBE_BASE: ${{ secrets.RELEASE_PROBE_BASE || 'https://vitalcv.com' }}
          RELEASE_TARGET_SHA: ${{ steps.target.outputs.sha }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PROD }}
          CLERK_FAPI_URL: ${{ secrets.CLERK_FAPI_URL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_REPORT_OUT: report.json
        run: pnpm verify:release

      - name: Egress sentinel — is the runner's own network alive?
        id: egress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two independent, non-production control endpoints. Only when BOTH
          # are unreachable is the runner's own egress proven dead — then any
          # probe failure in this run is "no signal", not a production
          # verdict. If either answers, egress works and a failure against
          # production stays a real red. Ambiguity resolves to red: ok=false
          # is only ever written on a confirmed double control failure.
          if curl -fsS --max-time 10 "https://www.githubstatus.com/api/v2/status.json" >/dev/null 2>&1 \
            || curl -fsS --max-time 10 -H "Authorization: Bearer ${GH_TOKEN}" \
                 "https://api.github.com/rate_limit" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record commit status + job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          WIRED: ${{ steps.preflight.outputs.wired }}
          UNWIRED_OK: ${{ steps.preflight.outputs.unwired_ok }}
          EGRESS_OK: ${{ steps.egress.outputs.ok }}
        run: |
          # The commit Status API has no `neutral` state (that lives in the Checks
          # API); `pending` is its non-pass/non-fail signal and renders as a grey
          # dot — deliberately NOT the red X that reads as a broken deploy.
          #
          # A FAILED smoke is a real deploy problem (wrong SHA, auth config, or
          # web→DB connectivity) — it must paint a RED status, never the grey
          # "not wired" pending it used to fall through to (preflight is skipped
          # when the smoke step fails, so WIRED is empty on that path).
          #
          # EXCEPTION, proven not assumed: when the egress sentinel confirmed
          # the runner's own network is dead (EGRESS_OK=false — BOTH control
          # endpoints unreachable), a smoke/verify failure says nothing about
          # production. That is "no signal" and records grey `pending`, which
          # is deliberately NOT the state a real probe failure records. Any
          # other sentinel outcome (true, empty, step skipped) keeps the red.
          if [ "$SMOKE_OUTCOME" = "failure" ] && [ "$EGRESS_OK" = "false" ]; then
            STATE=pending
            DESC="no signal — runner egress failure (GitHub infra); production was not reached"
          elif [ "$SMOKE_OUTCOME" = "failure" ]; then
            STATE=failure
            DESC="production smoke failed (version / auth-config / db-connectivity / public routes)"
          elif [ "$WIRED" != "true" ] && [ "$UNWIRED_OK" = "true" ]; then
            STATE=pending
            DESC="skipped — deliberately unwired (MONITORS_UNWIRED_OK=true)"
          elif [ "$WIRED" != "true" ]; then
            # Fail-closed: an unwired monitor verified NOTHING. Grey here is
            # what let this monitor look fine for its entire life.
            STATE=failure
            DESC="MISCONFIGURED — CLERK_SECRET_KEY not visible; nothing was verified"
          elif [ "$VERIFY_OUTCOME" = "success" ]; then
            STATE=success
            DESC="release verification"
          elif [ "$EGRESS_OK" = "false" ]; then
            STATE=pending
            DESC="no signal — runner egress failed during verification (GitHub infra)"
          else
            STATE=failure
            DESC="release verification"
          fi

          SHA=""
          if [ "$WIRED" = "true" ] && [ -f report.json ]; then
            # The status lands on the commit we INTENDED to verify (the deploy
            # commit), falling back to the served/main sha for scheduled runs.
            # Never containerSha-first: a failed rollout would repaint the OLD
            # still-serving commit's green status red and leave the new commit
            # with no status at all.
            SHA=$(jq -r '.targetSha // .containerSha // .mainSha // empty' report.json)
            if [ "$EGRESS_OK" != "false" ] || [ "$STATE" != "pending" ]; then
              OVERALL=$(jq -r '.overall // "unknown"' report.json)
              FAILED=$(jq -r '(.failedChecks // []) | join(", ")' report.json)
              HOLDER_OK=$(jq -r '[.checks[]? | select((.name|startswith("holder")) and .ok)] | length' report.json)
              HOLDER_TOTAL=$(jq -r '[.checks[]? | select(.name|startswith("holder"))] | length' report.json)
              DESC="${OVERALL}: holder ${HOLDER_OK}/${HOLDER_TOTAL}${FAILED:+; failed ${FAILED}}"
            fi
          fi
          [ -z "$SHA" ] && SHA="$TARGET_SHA"
          [ -z "$SHA" ] && SHA="$HEAD_SHA"
          # Defense in depth: only ever POST a status to a hex commit ref.
          if ! printf '%s' "$SHA" | grep -qiE '^[0-9a-f]{7,40}$'; then SHA="$HEAD_SHA"; fi
          DESC=$(printf '%s' "$DESC" | cut -c1-140)

          echo "commit status → $STATE @ $SHA — $DESC"
          gh api -X POST "repos/${REPO}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="vitalcv/release-verified" \
            -f description="$DESC" \
            -f target_url="$RUN_URL" >/dev/null

          {
            echo "## Release verification: ${STATE}"
            echo ""
            echo "- Commit: \`${SHA}\`"
            echo "- ${DESC}"
            echo "- [Run details](${RUN_URL})"
            if [ -f report.json ]; then
              echo ""
              echo '```json'
              jq '{overall, targetSha, mainSha, containerSha, failedChecks, cleanup}' report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No signal — GitHub infra, not a production verdict
        if: >-
          steps.egress.outputs.ok == 'false' &&
          (steps.smoke.outcome == 'failure' ||
           (steps.preflight.outputs.wired == 'true' && steps.verify.outcome != 'success'))
        run: |
          echo "::warning::Runner egress failure — this run produced NO SIGNAL about production. Commit status is grey pending, not red."

      - name: Fail the job when verification failed
        # A CONFIRMED runner-egress failure (sentinel ok=false) is "no signal",
        # not a production verdict — that path stays green here with the grey
        # pending status above. Any other sentinel outcome keeps the red.
        #
        # Three distinct red causes, deliberately NOT collapsed:
        #   - the secretless smoke failed (real deploy problem);
        #   - a wired verification failed (real signed-in problem);
        #   - the monitor is unwired without MONITORS_UNWIRED_OK (it verified
        #     nothing, which used to exit 0 and is the whole reason nobody
        #     noticed this monitor was inert for its entire life).
        # The unwired clause is guarded on the preflight having actually run,
        # so a smoke failure — which skips the preflight — cannot double-report
        # as a misconfiguration.
        if: >-
          steps.egress.outputs.ok != 'false' &&
          (steps.smoke.outcome == 'failure' ||
           (steps.preflight.outputs.wired == 'true' && steps.verify.outcome != 'success') ||
           (steps.preflight.outcome == 'success' &&
            steps.preflight.outputs.wired != 'true' &&
            steps.preflight.outputs.unwired_ok != 'true'))
        run: |
          if [ "${{ steps.preflight.outputs.wired }}" != "true" ] && [ "${{ steps.smoke.outcome }}" != "failure" ]; then
            echo "::error::Monitor is MISCONFIGURED — CLERK_SECRET_KEY was not visible, so nothing was verified. This is not a passing deploy; it is an absent test." >&2
          else
            echo "::error::Release verification failed — see the vitalcv/release-verified commit status and the job summary." >&2
          fi
          exit 1

name: W2-PR84A Institutional Rollout Survivability

# Institutional rollout survivability gate.
#
# This workflow runs three rollout-survivability suites that together
# guarantee partial-adoption resilience, rollout fail-closed semantics, and
# friction lineage reconstruction:
#
#   - rolloutSurvivability.test.ts      — pure-transform unit coverage
#   - rolloutSurvivability.ci.gate.ts   — frozen-enum + boundary-breach
#                                         canary (catches silent collapse
#                                         regressions before they ship)
#   - rolloutChaos.test.ts              — six C-ROLL-* chaos modes covering
#                                         mass operator resistance, parent-org
#                                         cascade, policy bundle drift,
#                                         telemetry blackout, rollback
#                                         contagion, and a mixed friction
#                                         storm
#
# These tests are mock-free and DB-free — they exercise the real
# `rolloutSurvivability` pure-transform module. The gate exists to catch
# silent rollout collapse, ambiguity loss under load, contamination spread
# beyond the intended boundary, and floor-violation regressions.
#
# This is the institutional-adoption companion to:
#   - scale-gate.yml             (governance throughput / event survivability)
#   - deployment-survivability.yml (deploy-layer chaos + lineage)
#   - replayCorruptionContainment (replay corruption boundary)
#
# Fail-closed: any of the three suites failing exits 1 and blocks the gate.

on:
  push:
    branches: [main, develop, 'wave-*/**', 'feature/**', 'fix/**']
    paths:
      - 'apps/api/backend/src/services/rollout/**'
      - 'apps/api/backend/src/services/__tests__/scale/rolloutSurvivability.scale.test.ts'
      - 'apps/api/backend/src/utils/deterministic.ts'
      - 'apps/api/backend/jest.config.js'
      - '.github/workflows/rollout-survivability.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/backend/src/services/rollout/**'
      - 'apps/api/backend/src/services/__tests__/scale/rolloutSurvivability.scale.test.ts'
      - 'apps/api/backend/src/utils/deterministic.ts'
      - 'apps/api/backend/jest.config.js'
      - '.github/workflows/rollout-survivability.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'

jobs:
  rollout-survivability:
    name: Institutional Rollout Survivability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (jest module resolution)
        run: pnpm --filter chai-vc-platform-backend exec prisma generate

      # The rollout suites mock nothing and touch no DB; the env vars below
      # are only present so jest.setup.ts → loadEnv() does not bail.
      - name: Run rollout survivability suites
        working-directory: apps/api/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rollout_gate_unused
          YC_DEMO_MODE: 'false'
        run: |
          pnpm exec jest \
            --testPathPattern='(services/rollout/__tests__/.+\.test\.ts|services/__tests__/scale/rolloutSurvivability\.scale\.test\.ts)$' \
            --maxWorkers=1 \
            --verbose \
            --passWithNoTests \
            2>&1 | tee rollout-gate.log

      - name: Surface institutional rollout board
        if: always()
        working-directory: apps/api/backend
        run: |
          echo "📊 Institutional Rollout Board"
          echo "------------------------------"
          if [ -f rollout-gate.log ]; then
            grep -E '\[(rollout-board|scale-board)\]' rollout-gate.log \
              | grep -E 'rollout-' \
              || echo "(no rollout-board metrics emitted — investigate)"
          else
            echo "(no rollout-gate.log produced — investigate)"
          fi

      - name: Upload rollout-gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-gate-log
          path: apps/api/backend/rollout-gate.log
          if-no-files-found: warn
          retention-days: 7

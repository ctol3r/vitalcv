name: Deploy Preflight

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/verifier-api/**'
      - 'packages/command-registry/**'
      - 'packages/crs/**'
      - 'packages/haip-config/**'
      - 'packages/ingest/**'
      - 'packages/poe-engine/**'
      - 'packages/psv/**'
      - 'packages/psv-adapters/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'railway.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/env/**'
      - 'scripts/railway/**'
      - '.github/workflows/ci-preflight.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/verifier-api/**'
      - 'packages/command-registry/**'
      - 'packages/crs/**'
      - 'packages/haip-config/**'
      - 'packages/ingest/**'
      - 'packages/poe-engine/**'
      - 'packages/psv/**'
      - 'packages/psv-adapters/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'railway.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/env/**'
      - 'scripts/railway/**'
      - '.github/workflows/ci-preflight.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'

jobs:
  preflight:
    name: Railway Deploy Preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalcv_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @vitalcv/api run build

      - name: Env contract check (production mode with dummy values)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
          API_KEYS: ci-test-key
          CORS_ORIGIN: https://ci-test.example.com
        run: node scripts/env/check.mjs --mode=production

      - name: Deploy preflight checks
        run: node scripts/railway/preflight.mjs

      - name: Ensure migrations directory exists
        run: |
          if [ ! -d "apps/api/backend/prisma/migrations" ]; then
            echo "Missing migrations directory" >&2
            exit 1
          fi

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
        run: |
          cd apps/api/backend
          npx prisma migrate deploy

      - name: Build QA dependencies
        run: pnpm turbo build --filter='chai-vc-platform-backend...'

      # The QA sweep exercises the fully compiled backend against the same
      # ephemeral Postgres used for migration and deploy smoke checks. It is a
      # required CI action, not a build side effect: builds must remain safe
      # for Railway and local environments that intentionally do not provide a
      # disposable database.
      - name: Run backend QA sweep
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
          NODE_ENV: test
          DISABLE_BACKGROUND_JOBS: '1'
          CORS_ORIGIN: https://ci-test.example.com
          ISSUER_KEY_ENCRYPTION_SECRET: ci-test-issuer-key-encryption-secret-000000000000
        run: pnpm --filter @vitalcv/api run qa:ci

      - name: Smoke tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
          STRICT_TRANSITION_MODE: "true"
        # Backend/API packages that require DB or service mocks are
        # exercised in backend-specific workflows. The preflight smoke
        # sweep excludes DB-dependent backend packages to avoid false
        # failures from missing Railway/DB context (no Clerk auth
        # context, no ISSUER_KEY_ENCRYPTION_SECRET, no seeded UUIDs).
        #
        # Full @vitalcv/web unit tests and the canonical web build are
        # protected by the Web Quality workflow on Node 22. Railway
        # preflight runs on the deploy/API Node 20 lane and should not
        # duplicate the full jsdom web test suite, which can fail before
        # tests start on Node 20 because of transitive ESM/CJS worker
        # loading drift. This keeps deploy preflight focused on Railway
        # backend/package smoke coverage without hiding Web Quality.
        # Same backend exclusion shape applied to monorepo.yml in
        # PR #173 (OPS-DEPLOY-1).
        run: pnpm turbo run test --filter=!@vitalcv/api --filter=!chai-vc-platform-backend --filter=!@vitalcv/web

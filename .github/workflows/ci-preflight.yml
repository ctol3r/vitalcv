name: Deploy Preflight

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/verifier-api/**'
      - 'packages/command-registry/**'
      - 'packages/crs/**'
      - 'packages/haip-config/**'
      - 'packages/ingest/**'
      - 'packages/poe-engine/**'
      - 'packages/psv/**'
      - 'packages/psv-adapters/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'railway.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/env/**'
      - 'scripts/railway/**'
      - '.github/workflows/ci-preflight.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/verifier-api/**'
      - 'packages/command-registry/**'
      - 'packages/crs/**'
      - 'packages/haip-config/**'
      - 'packages/ingest/**'
      - 'packages/poe-engine/**'
      - 'packages/psv/**'
      - 'packages/psv-adapters/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'railway.toml'
      - 'pnpm-lock.yaml'
      - 'scripts/env/**'
      - 'scripts/railway/**'
      - '.github/workflows/ci-preflight.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'

jobs:
  preflight:
    name: Railway Deploy Preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitalcv_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # `pnpm --filter @vitalcv/api run build` runs only this package's own tsc,
      # leaving every workspace dependency's `dist/` unbuilt. Nothing noticed
      # while the build was the last word, but the QA sweep below actually
      # imports them at runtime (`@vitalcv/trust-state` first). Turbo's
      # `dependsOn: ["^build"]` prebuilds the dependency graph.
      - name: Build API
        run: pnpm turbo run build --filter @vitalcv/api

      - name: Env contract check (production mode with dummy values)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
          API_KEYS: ci-test-key
          CORS_ORIGIN: https://ci-test.example.com
        run: node scripts/env/check.mjs --mode=production

      - name: Deploy preflight checks
        run: node scripts/railway/preflight.mjs

      - name: Ensure migrations directory exists
        run: |
          if [ ! -d "apps/api/backend/prisma/migrations" ]; then
            echo "Missing migrations directory" >&2
            exit 1
          fi

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
        run: |
          cd apps/api/backend
          npx prisma migrate deploy

      # The QA sweep boots the app and exercises route contracts against a real
      # database, so it can only run AFTER `prisma migrate deploy` above.
      #
      # It used to be the tail of the backend `build` script, which made it a
      # deploy-time side effect rather than a CI gate: `railway.toml` runs an
      # unfiltered `pnpm turbo build`, so the sweep booted the app against the
      # deploy database on every release, while nothing in CI ran it at all
      # (ci-preflight builds `@vitalcv/api`, whose build is tsc-only). It also
      # could never fail anything — `QA_FAIL_ON_CRITICAL` was set nowhere in
      # the repo, so `runQaSuite` returned 0 no matter how many critical
      # findings it reported.
      #
      # The sweep is NOT read-only: three consecutive local runs against one
      # database reported 42/43/44 findings and 14/15/16 criticals, with the
      # graph growing 26→27 nodes. It writes. That is the real reason it must
      # not run as part of a deploy build, and why it needs the ephemeral
      # database above rather than any shared one.
      #
      # NOT fail-closed yet, deliberately. Measured against a migrated, unseeded
      # database on 2026-08-02: 42 findings, of which **14 are critical** — all
      # `endpoint_server_error`, e.g. GET /.well-known/jwks.json returning 500,
      # and the sentinel NPI 0000000000 returning 500 rather than 404 from the
      # artifact/audit bundle routes. Those predate this step and were invisible
      # precisely because nothing ever set QA_FAIL_ON_CRITICAL.
      #
      # Turning it on today would red every PR, so this step reports instead.
      # Burn the 14 down, then set QA_FAIL_ON_CRITICAL=1 here — the code path
      # already exists in runQaSuite.ts and needs no further change.
      - name: Backend QA sweep (post-migration, reporting)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
        run: pnpm --filter @vitalcv/api run qa:ci

      - name: Smoke tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
          STRICT_TRANSITION_MODE: "true"
        # Backend/API packages that require DB or service mocks are
        # exercised in backend-specific workflows. The preflight smoke
        # sweep excludes DB-dependent backend packages to avoid false
        # failures from missing Railway/DB context (no Clerk auth
        # context, no ISSUER_KEY_ENCRYPTION_SECRET, no seeded UUIDs).
        #
        # Full @vitalcv/web unit tests and the canonical web build are
        # protected by the Web Quality workflow on Node 22. Railway
        # preflight runs on the deploy/API Node 20 lane and should not
        # duplicate the full jsdom web test suite, which can fail before
        # tests start on Node 20 because of transitive ESM/CJS worker
        # loading drift. This keeps deploy preflight focused on Railway
        # backend/package smoke coverage without hiding Web Quality.
        # Same backend exclusion shape applied to monorepo.yml in
        # PR #173 (OPS-DEPLOY-1).
        run: pnpm turbo run test --filter=!@vitalcv/api --filter=!chai-vc-platform-backend --filter=!@vitalcv/web

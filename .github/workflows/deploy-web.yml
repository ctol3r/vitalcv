name: Deploy Web + Smoke Test

# Railway is the canonical deployment target for apps/web. Railway auto-deploys
# the web service on push to main (apps/web/Dockerfile → next start). This
# workflow waits for that deploy and smoke-tests the /api/health endpoint.
#
# Vercel is deprecated — no preview/deploy step here. See
# docs/deployment/railway-migration.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/web/railway.toml'
      - 'apps/web/Dockerfile'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual redeploy'

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Railway auto-deploys on push to main.
  # This job waits for the deploy to complete, then runs smoke tests.
  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    # 10 min of SHA-wait budget + the remaining probes (db-health alone retries
    # 3× at 5 s). A 10-minute job timeout would let the wait consume the whole
    # budget and kill the job before it judged anything.
    timeout-minutes: 15

    steps:
      # W0.5. This job used to sleep 120s and poll /api/health for a 200. That
      # can only prove SOMETHING is answering — never that THIS commit is the
      # thing answering. A deploy that never ran, or one still building, passed
      # it: on 2026-07-27 the job went green ~2 min after #914 merged while
      # production was demonstrably still serving the previous commit. The SHA
      # check that makes the job meaningful already existed in
      # scripts/deploy-smoke.mjs — it was simply never wired into the deploy
      # path, only into the every-30-minutes release-verify cron.
      - name: Check out the deployed commit
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the deploy is live, honest, and self-consistent
        env:
          # The domain secret is an override, not a requirement. It previously
          # gated the whole job behind `exit 0`, so an unset secret silently
          # disabled the only post-deploy check.
          WEB_DOMAIN: ${{ secrets.RAILWAY_WEB_DOMAIN }}
        run: |
          BASE="https://${WEB_DOMAIN:-vitalcv.com}"
          echo "Verifying $BASE is serving ${GITHUB_SHA}"
          node scripts/deploy-smoke.mjs \
            --base "$BASE" \
            --sha "$GITHUB_SHA" \
            --wait-for-sha 600 \
            --receipt deploy-receipt.json \
            | tee smoke-output.txt

      - name: Publish the deploy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-receipt-${{ github.sha }}
          path: |
            deploy-receipt.json
            smoke-output.txt
          if-no-files-found: warn

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deploy verification"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo '```'
            cat smoke-output.txt 2>/dev/null || echo "no smoke output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

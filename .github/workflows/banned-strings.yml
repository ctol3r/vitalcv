name: Banned strings guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan public surfaces for truth-contract banned phrases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deeper history so the merge-base diff can resolve against
          # origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - name: Compute changed-file list for the scan scope
        id: changed
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          # Ensure the base ref is reachable.
          git fetch --no-tags --depth=200 origin "${BASE_REF}" || true
          # Diff against the merge base so reverts / merges don't
          # surface unrelated history.
          DIFF_BASE="origin/${BASE_REF}"
          if ! git rev-parse --verify "$DIFF_BASE" >/dev/null 2>&1; then
            echo "::error::diff base $DIFF_BASE not resolvable"
            exit 1
          fi
          # Path globs the gate cares about. Anything outside these
          # globs is out of scope.
          INCLUDE_PATTERNS=(
            'apps/web/**/*.ts'
            'apps/web/**/*.tsx'
            'apps/web/**/*.md'
            'apps/marketing/**/*.ts'
            'apps/marketing/**/*.tsx'
            'apps/marketing/**/*.md'
            'docs/ops/**/*.md'
            'docs/architecture/**/*.md'
            'docs/specs/**/*.md'
          )
          # git diff with `--name-only` against the three-dot range
          # gives the symmetric difference, which is what PR diffs are.
          git diff --name-only "${DIFF_BASE}...HEAD" -- "${INCLUDE_PATTERNS[@]}" \
            | tee changed-files.txt
          echo "count=$(wc -l < changed-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Skip when no in-scope files changed
        if: ${{ steps.changed.outputs.count == '0' }}
        run: echo "No in-scope files changed; banned-strings gate has nothing to scan."

      - name: Run banned-strings scanner on changed files
        if: ${{ steps.changed.outputs.count != '0' }}
        run: bash scripts/check-banned-strings.sh < changed-files.txt

# Stale-PR janitor — the mechanism behind §7.2 of
# docs/ops/open-pr-disposition-2026-08-07.md.
#
# The problem it exists for: on 2026-08-02 a disposition sentenced 225 open PRs
# to close. It was reviewed, merged to `main`, and never executed — so 194 of
# them were still open six days later, ~90% of a 216-PR backlog, each branch
# able to fire ~15 gates whenever a bulk sweep touched it. The judgement was
# never the missing piece; the execution was. A policy that depends on someone
# remembering is not a policy.
#
# What it does, daily:
#   21 days with no commits or human comments -> label `stale` + a warning
#   14 further days with still nothing        -> close + delete the head branch
#   any commit or human comment in between    -> label comes off, clock resets
#
# Label changes are NOT activity. If they were, this workflow's own labelling
# would reset the clock it is running and nothing would ever close.
#
# LIVE ON THE SCHEDULE, with a kill switch. A scheduled run enforces unless the
# repository variable STALE_JANITOR_ENFORCE is explicitly set to 'false' — set
# it and the janitor drops back to reporting immediately, no revert PR needed.
#
# Enabling was decided against evidence rather than left as a default nobody
# read. The dry-run on this workflow's own PR swept the live backlog and found
# exactly one PR past threshold (#506, 34 days inactive) and nothing closable:
#   #748   ok      12d since update
#   #506   MARK    34d inactive -> label + warn
#   summary: marked=1 closed=0 revived=0 exempt=0
# So the first enforced sweep labels one PR and closes none, and nothing can
# close for at least 14 days after that.
#
# Exemption is by label (`parked`, `security`, `pinned`), never by draft status.
# A draft is still backlog. `parked` is only legitimate with a named unblock
# condition stated on the PR, per the disposition.
#
# Not a required status check, so the `paths:` filter on `pull_request` is
# permitted by scripts/check-workflow-path-filters.js — that rule constrains the
# required set only. The PR trigger exists so a change to the janitor is
# exercised on its own PR; it is hard-wired to dry-run there regardless of the
# repo variable, because a PR-triggered run must never mutate the backlog.

name: Stale Janitor

on:
  schedule:
    # 04:17 UTC — off the hour on purpose, so it does not join the :00 herd that
    # this repo's runner-contention problem is made of.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, mutate nothing'
        type: boolean
        default: true
      stale_days:
        description: 'Days of inactivity before labelling stale'
        type: string
        default: '21'
      close_days:
        description: 'Days after labelling before closing'
        type: string
        default: '14'
  pull_request:
    # Self-test only. Always dry-run — see the job's ENFORCE expression.
    paths:
      - '.github/workflows/stale-janitor.yml'
      - 'scripts/stale-janitor.sh'

permissions:
  contents: write # delete the head branch of a closed PR
  pull-requests: write # close PRs
  issues: write # labels and comments reach PRs through the issues API

concurrency:
  # Ref-keyed per the invariant in scripts/check-workflow-concurrency.js, which
  # applies here because of the pull_request self-test trigger above.
  #
  # It also happens to be exactly what this workflow wants. Every scheduled run
  # carries ref `refs/heads/main`, so they all share one group and — with
  # cancellation guarded off main — queue rather than overlap. That preserves
  # the property that matters: two janitors must never mutate the backlog
  # concurrently and double-comment or double-close. The PR self-test runs on
  # `refs/pull/N/merge`, gets its own group, and is freely cancellable because
  # it is dry-run by construction.
  group: stale-janitor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  janitor:
    name: Sweep stale pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_DAYS: ${{ inputs.stale_days || '21' }}
          CLOSE_DAYS: ${{ inputs.close_days || '14' }}
          EXEMPT_LABELS: 'parked,security,pinned'
          MAX_OPS: '50'
          # A pull_request run NEVER enforces — that is the hard rule, and it is
          # the first conjunct so no later term can override it. Beyond that:
          # a dispatch enforces only when the operator unticks dry_run, and the
          # schedule enforces unless STALE_JANITOR_ENFORCE is set to 'false'.
          #
          # Note `!= 'false'` rather than `== 'true'`: the variable is a kill
          # switch, not an enable switch, so an unset variable means live. Any
          # value other than the literal 'false' therefore enforces — a typo in
          # the kill switch fails toward acting, which is why the schedule also
          # caps mutations at MAX_OPS and cannot close anything for 14 days
          # after first labelling it.
          ENFORCE: >-
            ${{ github.event_name != 'pull_request'
                && ( (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
                     || (github.event_name == 'schedule' && vars.STALE_JANITOR_ENFORCE != 'false') ) }}
        run: bash scripts/stale-janitor.sh

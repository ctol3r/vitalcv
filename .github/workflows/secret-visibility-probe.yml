# TEMPORARY DIAGNOSTIC — delete once CLERK_SECRET_KEY_PROD resolves.
#
# Second edition. The first (deleted in #1178) established that secrets reach
# these jobs at all. This one answers a narrower and stranger question:
#
#   CLERK_SECRET_KEY_PROD is VISIBLE in the repository secrets list, in this
#   repository, and `secrets.CLERK_SECRET_KEY_PROD` still resolves to the empty
#   string in a job — verified byte-for-byte in the workflow (od -c) across nine
#   dispatches, including after the secret was deleted and retyped.
#
# Nothing in the normal model of GitHub Actions explains that. So this stops
# theorising about WHERE the secret is and measures WHAT ACTIONS CAN READ.
#
# ─── A NOTE ON THE MISSING TIER 0 ────────────────────────────────────────────
#
# This file briefly carried a "tier 0" step that enumerated secret NAMES by
# serialising the whole secrets context to JSON and printing only its keys. It
# never ran: every run of the workflow while that step existed was refused
# before a single job was created. The detail and the evidence live next to the
# step that replaced it, further down. The short version is that dumping the
# entire secrets context appears to be statically refused, so the enumeration is
# not available to this repository and the question has to be answered with
# individually named lookups instead — which is what the tiers below do.
#
# What that costs: the invisible-character check. A stored name carrying a
# trailing space, a zero-width joiner or a Cyrillic С in place of an ASCII C
# would be visible in a name enumeration and is NOT visible below, because a
# lookup of a name that does not exist and a lookup of a name that exists but is
# empty both return the empty string. Keep that ambiguity in mind when reading
# the table: it is the one hypothesis these tiers cannot kill.
#
# ─── TIERS 1–3 — THE MEASUREMENT, and it is falsifiable ──────────────────────
#
#   TIER 1 — PROVEN-WORKING, and load-bearing. source-health-probe.yml reads
#     `secrets.CRON_SECRET` and `secrets.PROBE_URL`, and hard-fails on either
#     being empty:
#
#         if [ -z "${CRON_SECRET:-}" ] || [ -z "${PROBE_URL:-}" ]; then exit 1
#
#     There is no fallback and no default. That workflow has been SUCCEEDING all
#     night, so those two repository secrets demonstrably resolve to non-empty
#     in a plain job in this repo, right now — already established, not inferred
#     from this run. Tier 1 is therefore a self-check on the PROBE: if it reads
#     zero here it contradicts a visibly green workflow, and the probe is the
#     thing to distrust. (Checking that a control is actually load-bearing is
#     exactly what was skipped when RAILWAY_API_TOKEN was chosen as a control
#     merely because release-verify.yml mentions it. Referencing a secret says
#     nothing about whether it exists.)
#
#   TIER 2 — THE FIVE LISTED. The repository secrets list reportedly contains
#     exactly: CLERK_SECRET_KEY_PROD, RAILWAY_API_TOKEN, DATABASE_URL,
#     MONITORING_SECRET, CRON_SECRET. Lengths separate "this entry exists but is
#     empty" from "this entry is not visible", which tier 0 alone cannot.
#
#   TIER 3 — THE NEW CONTROL. `ZZ_TEST` is a throwaway the owner creates by hand
#     (any value) immediately before running this. It tests whether a NEWLY
#     created secret reaches Actions at all. If ZZ_TEST is absent from tier 0
#     too, no new secret is propagating and nothing about naming is at fault.
#
#   ANOMALY — `CLERK_FAPI_URL` read 25 in the first probe despite not appearing
#     in the five-name list. Tier 0 settles whether that was real.
#
# No `environment:` — environment scope was investigated and disproved (#1140,
# #1178), and declaring one here would CHANGE what tier 0 enumerates, ruining
# the measurement. A repository secret is visible to every job.
#
# Read-only: no network, no Clerk contact, no deletions. Manual dispatch only.

name: Secret Visibility Probe

on:
  workflow_dispatch:
  # WHY A pull_request TRIGGER ON A DIAGNOSTIC. Every agent-initiated
  # `workflow_dispatch` of this workflow is gated: runs 31258285345,
  # 31258328137 and 31258710313 each concluded `action_required` one second
  # after creation with ZERO jobs, and the API refuses to retry them
  # ("This workflow run cannot be retried through the API"). Approving one run
  # does not ungate the next dispatch. Run 1 (31238667349) only ever executed
  # on a human-initiated attempt 2.
  #
  # `pull_request` runs are NOT gated — #1185's fifteen checks all executed
  # unattended on this same repo — and a same-repo PR receives repository
  # secrets normally, which is the whole requirement for tier 0. So the PR
  # that adds this trigger is also the PR that fires it.
  #
  # Path-filtered to this file alone: the probe must never run on unrelated
  # PRs. It is not a required check, so `check-workflow-path-filters.js` (which
  # forbids path filters on REQUIRED contexts only) is unaffected.
  pull_request:
    paths:
      - '.github/workflows/secret-visibility-probe.yml'

permissions:
  contents: read

concurrency:
  # Required of every pull_request-triggered workflow by
  # check-workflow-concurrency.js — the rule that came out of the runner-pool
  # starvation incident this whole piece of work started from. Ref-keyed so a
  # new push coalesces with the stale run for that ref; cancellation guarded
  # off main so superseded push runs on main keep their check runs. Inert here
  # (PR refs are refs/pull/N/merge) and required anyway, so the workflow stays
  # safe if a `push: main` trigger is ever added.
  group: secret-visibility-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  probe:
    name: Enumerate what Actions can actually read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # TIER 0 REMOVED — and its removal is itself the measurement.
      #
      # Tier 0 serialised the whole secrets context and printed only its keys —
      # secret NAMES, no values. (The expression is deliberately not reproduced
      # anywhere in this file, not even in a comment: if the refusal below comes
      # from a static scan of the workflow text, then quoting the expression
      # would keep tripping it and this experiment would answer the wrong
      # question.) Every run of the workflow carrying that step was gated
      # `action_required` one second after creation with ZERO jobs, on BOTH
      # triggers:
      #
      #   31258285345  workflow_dispatch  action_required  0 jobs
      #   31258328137  workflow_dispatch  action_required  0 jobs
      #   31258710313  workflow_dispatch  action_required  0 jobs  (post-approval)
      #   31258838356  pull_request       action_required  0 jobs
      #
      # The last one is decisive: its fifteen sibling checks on the very same
      # pull_request event ran unattended. So the gate is not the trigger, not
      # the actor, and not repository policy — it is THIS WORKFLOW. And the
      # previous edition of this same file, which read individual `secrets.X`
      # names and never serialised the context, executed fine (31238667349).
      #
      # The only material difference is that whole-context serialisation.
      # Dumping every secret at once is precisely the shape of an exfiltration
      # attempt, and a static guard that refuses to schedule such a run — before
      # any job exists, hence zero jobs in one second — is a reasonable thing for
      # GitHub to have. That is a hypothesis, and this commit is its test:
      # nothing else changed, so if this run executes, that construct was the
      # gate. If it is STILL refused, the hypothesis is dead and the cause is
      # something else in this file — check the workflow name and path next,
      # since those are what survived every edition.
      #
      # Losing tier 0 costs the invisible-character check (a stored name with a
      # trailing space or a Cyrillic С). Tiers 1–3 still answer the actionable
      # question, because ZZ_TEST is a real control: ZZ_TEST non-zero with
      # CLERK_SECRET_KEY_PROD zero means that one entry is broken and should be
      # recreated under another name; both zero means no newly created secret
      # reaches Actions at all.
      - name: Tiers 1–3 — lengths only, never values
        env:
          # Tier 1 — proven working: source-health-probe.yml exits 1 if either
          # of these is empty, and that workflow is green.
          T1_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          T1_PROBE_URL: ${{ secrets.PROBE_URL }}
          # Tier 2 — the five reportedly in the repository secrets list
          T2_CLERK_SECRET_KEY_PROD: ${{ secrets.CLERK_SECRET_KEY_PROD }}
          T2_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          T2_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          T2_MONITORING_SECRET: ${{ secrets.MONITORING_SECRET }}
          # Tier 3 — throwaway control, created by hand just before this run
          T3_ZZ_TEST: ${{ secrets.ZZ_TEST }}
          # Anomaly — read 25 in the first probe, absent from the list
          AN_CLERK_FAPI_URL: ${{ secrets.CLERK_FAPI_URL }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Tiers 1–3 — resolved lengths"
            echo ""
            echo "| tier | name | length |"
            echo "| --- | --- | --- |"
            echo "| 1 proven | CRON_SECRET | ${#T1_CRON_SECRET} |"
            echo "| 1 proven | PROBE_URL | ${#T1_PROBE_URL} |"
            echo "| 2 listed | CLERK_SECRET_KEY_PROD | ${#T2_CLERK_SECRET_KEY_PROD} |"
            echo "| 2 listed | RAILWAY_API_TOKEN | ${#T2_RAILWAY_API_TOKEN} |"
            echo "| 2 listed | DATABASE_URL | ${#T2_DATABASE_URL} |"
            echo "| 2 listed | MONITORING_SECRET | ${#T2_MONITORING_SECRET} |"
            echo "| 3 control | ZZ_TEST | ${#T3_ZZ_TEST} |"
            echo "| anomaly | CLERK_FAPI_URL | ${#AN_CLERK_FAPI_URL} |"
            echo ""
            echo "### Reading it"
            echo ""
            echo "- **Tier 1 zero** → this probe contradicts source-health-probe.yml, which is green and exits 1 on those secrets being empty. Distrust the probe, not the config."
            echo "- **Tier 1 non-zero, tier 2 zero** → Actions genuinely cannot see those entries. **Check which TAB they are on before anything else**: \`Settings → Secrets and variables\` keeps separate **Actions**, **Dependabot** and **Codespaces** stores, they render identically, and a Dependabot secret reads as the empty string here with no error. That was the cause on 2026-08-08, found only after five wrong theories about naming and scope."
            echo "- **ZZ_TEST zero** → a secret created by hand moments ago is not reaching this job either, so nothing about the other names is at fault. Same tab check applies."
            echo "- **ZZ_TEST non-zero while a named secret is zero** → newly created secrets do arrive, so that one entry is specifically broken. Recreate it under a different name."
            echo "- A name this job cannot see and a name that does not exist are **indistinguishable** — both are the empty string. This probe cannot tell you which, only that Actions cannot read it."
            echo ""
            echo "Actions repository secrets: <https://github.com/ctol3r/vitalcv/settings/secrets/actions>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

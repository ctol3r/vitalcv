# TEMPORARY DIAGNOSTIC — delete once CLERK_SECRET_KEY resolves.
#
# Five dispatches of Synthetic Reconcile have now resolved
# `secrets.CLERK_SECRET_KEY` to the empty string: as a repository secret, as an
# environment secret, with `environment: production`, with
# `environment: Production`, and on a commit verified to carry the declaration.
# Each attempt was a guess. This job stops guessing and measures.
#
# WHAT IT PRINTS: character LENGTHS ONLY, never values. `${#VAR}` yields an
# integer. A length is enough to tell "resolved" from "did not resolve" and is
# not itself sensitive. GitHub also masks secret values in logs, but this never
# echoes one regardless.
#
# THE THREE THINGS IT SEPARATES:
#
#   1. CONTROL — RAILWAY_API_TOKEN is a repository secret already consumed by
#      release-verify. If it resolves here and CLERK_SECRET_KEY does not, the
#      problem is specific to that one secret. If NEITHER resolves, something
#      broader is wrong with how secrets reach these jobs, and every previous
#      hypothesis was aimed at the wrong layer.
#
#   2. ENVIRONMENT SHADOWING — job `with-environment` declares
#      `environment: Production`, job `without-environment` declares none.
#      Environment secrets WIN over repository secrets on a name collision, so
#      a stale or empty `CLERK_SECRET_KEY` sitting on the Production
#      environment (or on the lowercase `production` that GitHub auto-created
#      in #1138) would override the good repository secret. If the length is
#      non-zero WITHOUT the environment and zero WITH it, that is the answer.
#
#   3. NAME MISMATCH — probes several plausible spellings. A trailing space,
#      an underscore in the wrong place, or a zero-width character from a paste
#      all make `secrets.CLERK_SECRET_KEY` resolve empty with no error
#      anywhere. If a variant resolves, the name is simply wrong.
#
# It also reports `vars.CLERK_SECRET_KEY`, because the key WAS originally stored
# as a variable. If that still has length, the variable was never removed — and
# a lingering variable of the same name is worth ruling out as a reason the
# secret does not take.
#
# Read-only: no network calls, no Clerk contact, no deletions. Manual dispatch
# only — no schedule, so it costs nothing until someone runs it.

name: Secret Visibility Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  with-environment:
    name: Resolve secrets WITH environment Production
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Lengths only — never values
        env:
          CONTROL_RAILWAY: ${{ secrets.RAILWAY_API_TOKEN }}
          A_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          B_CLERK_SECRET: ${{ secrets.CLERK_SECRET }}
          C_CLERK_API_KEY: ${{ secrets.CLERK_API_KEY }}
          D_CLERK_BACKEND_API_KEY: ${{ secrets.CLERK_BACKEND_API_KEY }}
          E_CLERK_SECRET_KEY_VAR: ${{ vars.CLERK_SECRET_KEY }}
          F_CLERK_FAPI_URL: ${{ secrets.CLERK_FAPI_URL }}
        run: |
          {
            echo "## WITH \`environment: Production\`"
            echo ""
            echo "| name | kind | length |"
            echo "| --- | --- | --- |"
            echo "| RAILWAY_API_TOKEN (control) | secret | ${#CONTROL_RAILWAY} |"
            echo "| CLERK_SECRET_KEY | secret | ${#A_CLERK_SECRET_KEY} |"
            echo "| CLERK_SECRET | secret | ${#B_CLERK_SECRET} |"
            echo "| CLERK_API_KEY | secret | ${#C_CLERK_API_KEY} |"
            echo "| CLERK_BACKEND_API_KEY | secret | ${#D_CLERK_BACKEND_API_KEY} |"
            echo "| CLERK_SECRET_KEY | **variable** | ${#E_CLERK_SECRET_KEY_VAR} |"
            echo "| CLERK_FAPI_URL | secret | ${#F_CLERK_FAPI_URL} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  without-environment:
    name: Resolve secrets WITHOUT any environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lengths only — never values
        env:
          CONTROL_RAILWAY: ${{ secrets.RAILWAY_API_TOKEN }}
          A_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          B_CLERK_SECRET: ${{ secrets.CLERK_SECRET }}
          C_CLERK_API_KEY: ${{ secrets.CLERK_API_KEY }}
          D_CLERK_BACKEND_API_KEY: ${{ secrets.CLERK_BACKEND_API_KEY }}
          E_CLERK_SECRET_KEY_VAR: ${{ vars.CLERK_SECRET_KEY }}
          F_CLERK_FAPI_URL: ${{ secrets.CLERK_FAPI_URL }}
        run: |
          {
            echo "## WITHOUT any \`environment:\`"
            echo ""
            echo "| name | kind | length |"
            echo "| --- | --- | --- |"
            echo "| RAILWAY_API_TOKEN (control) | secret | ${#CONTROL_RAILWAY} |"
            echo "| CLERK_SECRET_KEY | secret | ${#A_CLERK_SECRET_KEY} |"
            echo "| CLERK_SECRET | secret | ${#B_CLERK_SECRET} |"
            echo "| CLERK_API_KEY | secret | ${#C_CLERK_API_KEY} |"
            echo "| CLERK_BACKEND_API_KEY | secret | ${#D_CLERK_BACKEND_API_KEY} |"
            echo "| CLERK_SECRET_KEY | **variable** | ${#E_CLERK_SECRET_KEY_VAR} |"
            echo "| CLERK_FAPI_URL | secret | ${#F_CLERK_FAPI_URL} |"
            echo ""
            echo "Reading the result:"
            echo "- control 0 in BOTH jobs → secrets are not reaching these jobs at all; the fault is not CLERK-specific."
            echo "- CLERK_SECRET_KEY non-zero HERE but 0 in the other job → an environment secret of the same name is shadowing the repository one."
            echo "- a VARIANT name non-zero → the secret is stored under that name."
            echo "- the **variable** row non-zero → the original variable still exists and was never removed."
            echo "- everything 0 except the control → the secret does not exist under any probed name."
          } | tee -a "$GITHUB_STEP_SUMMARY"

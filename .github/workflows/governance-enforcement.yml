name: governance-enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-lexicon-scan:
    name: Trust Lexicon Scan (CI Drift Enforcement)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Install tsx (no full workspace install — fast scan)
        run: npm install -g tsx@4

      - name: Run trust-lexicon scan
        run: tsx scripts/governance/check-trust-lexicon.ts

      - name: Run trust-lexicon scan (JSON report)
        if: always()
        run: tsx scripts/governance/check-trust-lexicon.ts --json > trust-lexicon-report.json || true

      - name: Upload trust-lexicon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-lexicon-report
          path: trust-lexicon-report.json
          retention-days: 30

      - name: Run governance adoption-coverage scan (W2-PR23A anti-bypass)
        run: tsx scripts/governance/check-adoption-coverage.ts

      - name: Run adoption-coverage scan (JSON report)
        if: always()
        run: tsx scripts/governance/check-adoption-coverage.ts --json > governance-adoption-report.json || true

      - name: Upload adoption-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-adoption-report
          path: governance-adoption-report.json
          retention-days: 30

      - name: Install workspace deps for semantic-snapshot diff
        run: pnpm install --frozen-lockfile

      - name: Build governance-runtime (semantic-snapshot dep)
        run: pnpm --filter @vitalcv/governance-runtime build

      - name: Run semantic-mutation diff (W2-PR25A evolution safety)
        run: tsx scripts/governance/semantic-snapshot.ts diff --baseline scripts/governance/baseline-snapshot.json

      - name: Run governance runtime verification (W2-PR26A invariants)
        run: tsx scripts/governance/verify-runtime.ts

      - name: Run governance runtime verification (JSON report)
        if: always()
        run: tsx scripts/governance/verify-runtime.ts --json > governance-verification-report.json || true

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-verification-report
          path: governance-verification-report.json
          retention-days: 30

      - name: Run override-discipline gate (W2-PR29A human-override integrity)
        run: tsx scripts/governance/check-override-discipline.ts

      - name: Run override-discipline gate (JSON report)
        if: always()
        run: tsx scripts/governance/check-override-discipline.ts --json > governance-override-discipline-report.json || true

      - name: Upload override-discipline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-override-discipline-report
          path: governance-override-discipline-report.json
          retention-days: 30

      - name: Run institutional-drift gate (W2-PR30A longitudinal memory)
        run: tsx scripts/governance/check-institutional-drift.ts

      - name: Run institutional-drift gate (JSON report)
        if: always()
        run: tsx scripts/governance/check-institutional-drift.ts --json > governance-institutional-drift-report.json || true

      - name: Upload institutional-drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-institutional-drift-report
          path: governance-institutional-drift-report.json
          retention-days: 30

      - name: Run persistence-integrity gate (W2-PR32A tamper-evidence)
        run: tsx scripts/governance/check-persistence-integrity.ts

      - name: Run persistence-integrity gate (JSON report)
        if: always()
        run: tsx scripts/governance/check-persistence-integrity.ts --json > governance-persistence-integrity-report.json || true

      - name: Upload persistence-integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-persistence-integrity-report
          path: governance-persistence-integrity-report.json
          retention-days: 30

      - name: Run replay-survivability gate (W2-PR33A)
        run: tsx scripts/governance/check-replay-survivability.ts

      - name: Upload replay-survivability report
        if: always()
        run: tsx scripts/governance/check-replay-survivability.ts --json > governance-replay-survivability-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-replay-survivability-report
          path: governance-replay-survivability-report.json
          retention-days: 30

      - name: Run incident-governance gate (W2-PR35A)
        run: tsx scripts/governance/check-incident-governance.ts

      - name: Upload incident-governance report
        if: always()
        run: tsx scripts/governance/check-incident-governance.ts --json > governance-incidents-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-incidents-report
          path: governance-incidents-report.json
          retention-days: 30

      - name: Run external-trust-api self-audit (W2-PR37A)
        run: tsx scripts/governance/check-external-trust-api.ts

      - name: Run kernel-freeze gate (W2-PR41A)
        run: tsx scripts/governance/check-kernel-freeze.ts

      - name: Run identity-claims gate (W2-PR43A)
        run: tsx scripts/governance/check-identity-claims.ts

      - name: Run verifier-workspace gate (W2-PR45A)
        run: tsx scripts/governance/check-verifier-workspace.ts

      - name: Run enterprise-admin gate (W2-PR47A)
        run: tsx scripts/governance/check-enterprise-admin.ts

      - name: Run pilot-intelligence gate (W2-PR51A)
        run: tsx scripts/governance/check-pilot-intelligence.ts

      - name: Run delegated-trust gate (W2-PR53A)
        run: tsx scripts/governance/check-delegated-trust.ts

      - name: Run workflow-automation gate (W2-PR56A)
        run: tsx scripts/governance/check-workflow-automation.ts

      - name: Run distributed-resilience gate (W2-PR59A)
        run: tsx scripts/governance/check-distributed-resilience.ts

      - name: Run ecosystem-network gate (W2-PR62A)
        run: tsx scripts/governance/check-ecosystem-network.ts

      - name: Run revocation-cascade gate (W2-PR63A)
        run: tsx scripts/governance/check-revocation-cascade.ts

      - name: Run evidence-durability gate (W2-PR66A)
        run: tsx scripts/governance/check-evidence-durability.ts

      - name: Run evidence-compression gate (W2-PR69A)
        run: tsx scripts/governance/check-evidence-compression.ts

      - name: Run constitutional-convergence gate (W2-PR72A capstone)
        run: tsx scripts/governance/check-constitutional-convergence.ts

      - name: Run replay-cognition gate (W2-PR73A)
        run: tsx scripts/governance/check-replay-cognition.ts

      - name: Run replay-search gate (W2-PR76A)
        run: tsx scripts/governance/check-replay-search.ts

      - name: Run meta-verification (W2-PR27A blind-spot detection)
        run: tsx scripts/governance/meta-verify.ts

      - name: Run meta-verification (JSON report)
        if: always()
        run: tsx scripts/governance/meta-verify.ts --json > governance-meta-verification-report.json || true

      - name: Upload meta-verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-meta-verification-report
          path: governance-meta-verification-report.json
          retention-days: 30

      - name: Capture current semantic snapshot (artifact)
        if: always()
        run: tsx scripts/governance/semantic-snapshot.ts capture --out current-semantic-snapshot.json || true

      - name: Upload current semantic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-semantic-snapshot
          path: current-semantic-snapshot.json
          retention-days: 30

  governance-runtime-tests:
    name: Governance Runtime Tests (W2-PR17A/18A/19A/20A)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @vitalcv/governance-runtime
        run: pnpm --filter @vitalcv/governance-runtime typecheck

      - name: Test @vitalcv/governance-runtime
        run: pnpm --filter @vitalcv/governance-runtime test

      - name: Build @vitalcv/governance-runtime
        run: pnpm --filter @vitalcv/governance-runtime build

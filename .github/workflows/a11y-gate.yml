name: A11Y Gate

on:
  # Deliberately NOT path-filtered — `axe WCAG 2.2 AA` is a REQUIRED status
  # check on main, and the two are incompatible: a filtered workflow is
  # skipped, its check run is never created, and a required check that
  # never reports blocks the PR forever. This gate is diff-independent
  # anyway (it scans the whole tree / fixed fixtures), so the filter
  # saved nothing. Enforced by scripts/check-workflow-path-filters.js.
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  axe-wcag22:
    name: axe WCAG 2.2 AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace package dependencies
        run: pnpm turbo build --filter='!@vitalcv/web'
      - name: Run axe WCAG 2.2 AA suite
        run: pnpm --filter @vitalcv/web exec vitest run __tests__/a11y/hero-routes.test.tsx

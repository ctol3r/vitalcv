name: Public Claims Gate

# Blocks over-claiming public copy (banned strings / unsupported marketing claims)
# from reaching main. Scans apps/web/app + apps/web/components via
# scripts/check-public-claims.ts. The script uses only Node built-ins, so this
# gate needs no dependency install and stays fast.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'scripts/check-public-claims.ts'
      - '.github/workflows/public-claims-gate.yml'

env:
  NODE_VERSION: '22'

jobs:
  check-public-claims:
    name: check-public-claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan public copy for prohibited claims
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-public-claims.ts

name: Canonical Source Adapter Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same ref — never on main — so a stale push's
# gate runs release their hosted runners instead of starving the pool.
# Invariant enforced by scripts/check-workflow-concurrency.js.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  canonical-source-adapters:
    name: Canonical Source Adapter Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reject deprecated adapter imports from routes and UI
        run: node scripts/check-canonical-source-adapter-imports.mjs

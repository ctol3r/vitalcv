name: W2-PR70A Trust Benchmark Gate

# Trust-Layer Operational Benchmarking gate.
#
# This workflow runs:
#   - the per-module benchmarking suites under
#     apps/api/backend/src/services/audit/benchmarking/__tests__/
#   - the scale test trustBenchmarking.scale.test.ts under
#     apps/api/backend/src/services/__tests__/scale/
#
# Surfaces the [benchmark-board] metric stream so a regulator can read
# the deltas (operational gain, ambiguity preservation, fail-closed
# behavior) directly from the workflow log.
#
# All tests are mock-free pure-transform tests — no database required.

on:
  push:
    branches: [main, develop, 'wave-*/**', 'feature/**', 'fix/**']
    paths:
      - 'apps/api/backend/src/services/audit/benchmarking/**'
      - 'apps/api/backend/src/services/audit/replayEngine.ts'
      - 'apps/api/backend/src/services/audit/replayCorruptionContainment.ts'
      - 'apps/api/backend/src/services/runtimeTrustCohesion.ts'
      - 'apps/api/backend/src/services/multi-tenant/**'
      - 'apps/api/backend/src/services/__tests__/scale/trustBenchmarking.scale.test.ts'
      - 'apps/api/backend/src/utils/deterministic.ts'
      - '.github/workflows/trust-benchmark-gate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/backend/src/services/audit/benchmarking/**'
      - 'apps/api/backend/src/services/audit/replayEngine.ts'
      - 'apps/api/backend/src/services/audit/replayCorruptionContainment.ts'
      - 'apps/api/backend/src/services/runtimeTrustCohesion.ts'
      - 'apps/api/backend/src/services/multi-tenant/**'
      - 'apps/api/backend/src/services/__tests__/scale/trustBenchmarking.scale.test.ts'
      - 'apps/api/backend/src/utils/deterministic.ts'
      - '.github/workflows/trust-benchmark-gate.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '10.6.1'

jobs:
  trust-benchmark-gate:
    name: Trust-Layer Operational Benchmarking
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (jest module resolution)
        run: pnpm --filter chai-vc-platform-backend exec prisma generate

      - name: Run benchmarking unit suites
        working-directory: apps/api/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmark_gate_unused
          YC_DEMO_MODE: 'false'
        run: |
          pnpm exec jest \
            --testPathPattern='services/audit/benchmarking/__tests__/.+\.test\.ts$' \
            --maxWorkers=1 \
            --verbose \
            --passWithNoTests \
            2>&1 | tee benchmark-unit.log

      - name: Run benchmarking scale gate
        working-directory: apps/api/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmark_gate_unused
          YC_DEMO_MODE: 'false'
        run: |
          pnpm exec jest \
            --testPathPattern='__tests__/scale/trustBenchmarking\.scale\.test\.ts$' \
            --maxWorkers=1 \
            --verbose \
            --passWithNoTests \
            2>&1 | tee benchmark-scale.log

      - name: Surface benchmark board metrics
        if: always()
        working-directory: apps/api/backend
        run: |
          echo "📊 Trust Benchmarking Board"
          echo "----------------------------"
          for f in benchmark-unit.log benchmark-scale.log; do
            if [ -f "$f" ]; then
              echo "── $f ──"
              grep -E '\[benchmark-board\]' "$f" || echo "(no [benchmark-board] metrics in $f)"
            fi
          done

      - name: Banned-strings sweep on benchmarking surface
        if: always()
        working-directory: apps/api/backend
        run: |
          echo "🔒 Verifying CLAUDE.md banned-string contract on benchmarking surface"
          set +e
          # Match any banned phrase (case-insensitive) on copy paths only.
          # Test fixtures + tests legally include the phrases as test split-join
          # constants, so we only sweep the production source files.
          BANNED=(
            'automatically verified'
            'guaranteed verification'
            'complete credentialing'
            'instant credentialing'
            'legally accepted'
            'risk transferred'
            'final verification without review'
            'source confirmed before response'
            'certified compliant'
            'HIPAA compliant'
            'SOC2 certified'
          )
          FOUND=0
          for phrase in "${BANNED[@]}"; do
            HITS=$(grep -RInF --include='*.ts' --exclude-dir=__tests__ "$phrase" \
              src/services/audit/benchmarking/ || true)
            if [ -n "$HITS" ]; then
              echo "❌ banned phrase found: $phrase"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "Banned-string sweep failed."
            exit 1
          fi
          echo "✅ Banned-string sweep clean."

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-benchmark-logs
          path: |
            apps/api/backend/benchmark-unit.log
            apps/api/backend/benchmark-scale.log
          if-no-files-found: warn
          retention-days: 7

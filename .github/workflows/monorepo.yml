name: Monorepo CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/marketing/**'
      - 'apps/web/**'
      - 'apps/verifier-api/**'
      - 'apps/issuer-api/**'
      - 'apps/admin-api/**'
      - 'apps/status-api/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/monorepo.yml'

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter chai-vc-platform-backend exec prisma generate
          pnpm --filter @vitalcv/marketing exec prisma generate

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Build apps
        run: |
          pnpm -r \
            --filter @vitalcv/api \
            --filter @vitalcv/admin-api \
            --filter @vitalcv/authz \
            --filter @vitalcv/issuer-api \
            --filter @vitalcv/marketing \
            --filter @vitalcv/status-api \
            --filter @vitalcv/verifier-api \
            --filter @vitalcv/web \
            run build

      - name: Run typecheck
        run: pnpm turbo run typecheck

      - name: Run lint
        run: pnpm turbo run lint

      - name: Run tests (non-backend packages)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
        # The backend's actual package name is chai-vc-platform-backend
        # (see apps/api/backend/package.json), NOT @vitalcv/api. Without
        # excluding both names, the backend integration test suite ran
        # on every push to main and failed (no DB, no external service
        # mocks) — repeatedly red since at least PR #167. Real backend
        # test coverage lives in .github/workflows/ci-preflight.yml
        # (see the "backend tests" step there); the deploy-api job in
        # this file only builds the backend, it does not test it.
        run: pnpm turbo run test --filter=!@vitalcv/api --filter=!chai-vc-platform-backend

      - name: Scale integrity gate (W2-PR38A)
        # Mock-based scale + throughput suite for the replay engine and
        # runtime trust cohesion. Does NOT need a database — runs Jest
        # directly with mocked prisma + capsuleEngine. Guards against
        # silent throughput collapse, governance classification drift,
        # tamper-evidence regressions, and audit-bundle partial-failure
        # invisibility. Suite lives under apps/api/backend/src/**/__tests__/scale/.
        run: pnpm --filter chai-vc-platform-backend run test:scale

      - name: NCQA + regulatory operationalization gate (W2-PR40A)
        # Pure-function NCQA validation suite. Asserts the regulatory-export
        # modules uphold their NCQA semantics: 120-day window constant,
        # determinism, tamper-detection, traceability coverage, banned-string
        # absence, and completeness semantics. Fails CI on any drift.
        # Suite lives in apps/api/backend/src/services/audit/regulatoryExports/.
        run: pnpm --filter chai-vc-platform-backend run ncqa:validate

  deploy-api:
    name: Deploy API
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo run build --filter='@vitalcv/api'

      - name: Deploy to container registry
        # Add your deployment steps here
        run: echo "Deploy API to container registry"

  deploy-web:
    name: Deploy Web
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm turbo run build --filter='@vitalcv/web'

      - name: Deploy to Vercel
        # Add Vercel deployment steps here
        run: echo "Deploy to Vercel"

name: Monorepo CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/authz/**'
      - 'apps/marketing/**'
      - 'apps/web/**'
      - 'apps/verifier-api/**'
      - 'apps/issuer-api/**'
      - 'apps/admin-api/**'
      - 'apps/status-api/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/monorepo.yml'

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter chai-vc-platform-backend exec prisma generate
          pnpm --filter @vitalcv/marketing exec prisma generate

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Build apps
        run: |
          pnpm -r \
            --filter @vitalcv/api \
            --filter @vitalcv/admin-api \
            --filter @vitalcv/authz \
            --filter @vitalcv/issuer-api \
            --filter @vitalcv/marketing \
            --filter @vitalcv/status-api \
            --filter @vitalcv/verifier-api \
            --filter @vitalcv/web \
            run build

      - name: Run typecheck
        run: pnpm turbo run typecheck

      - name: Run lint
        run: pnpm turbo run lint

      - name: Run tests (non-backend packages)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitalcv_preflight
        # The backend's actual package name is chai-vc-platform-backend
        # (see apps/api/backend/package.json), NOT @vitalcv/api. Without
        # excluding both names, the backend integration test suite ran
        # on every push to main and failed (no DB, no external service
        # mocks) — repeatedly red since at least PR #167. Real backend
        # test coverage lives in .github/workflows/ci-preflight.yml
        # (see the "backend tests" step there); the deploy-api job in
        # this file only builds the backend, it does not test it.
        #
        # @vitalcv/web is excluded for the same class of reason: this job
        # has no postgres service, but the dummy DATABASE_URL above (kept
        # for other packages' env validation) un-skips the web suite's
        # real-Postgres tests (__tests__/verifier-worklist-db.test.ts
        # skips only when DATABASE_URL is unset), which then fail with
        # P1001 — red on every push to main since PR #469. The full web
        # suite runs without DATABASE_URL in .github/workflows/ci.yml
        # ("Web Quality"), which triggers on the same web/package paths.
        run: pnpm turbo run test --filter=!@vitalcv/api --filter=!chai-vc-platform-backend --filter=!@vitalcv/web

      # REMOVED: "Scale integrity gate (W2-PR38A)" and "NCQA + regulatory
      # operationalization gate (W2-PR40A)". Both steps referenced suites
      # that do not exist on main — `test:scale` targets
      # apps/api/backend/**/__tests__/scale/ (jest: "No tests found",
      # exit 1) and `ncqa:validate` runs
      # src/tools/runNcqaValidationGate.ts, which was never merged. The
      # steps therefore failed on every push and had never passed on
      # main. Re-add each gate in the SAME PR that lands its suite.

  # Build-validation only. The real API deploy is Railway's GitHub
  # integration (service delightful-essence) triggered directly on push
  # to main; this job proves the API still builds from a clean checkout.
  # (Its previous "Deploy to container registry" step was an `echo`
  # placeholder — removed rather than left pretending to deploy.)
  deploy-api:
    name: API build validation
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo run build --filter='@vitalcv/api'

  # Build-validation only. The real web deploy is Railway's GitHub
  # integration (service vitalcv-web, apps/web/Dockerfile) triggered
  # directly on push to main.
  deploy-web:
    name: Web build validation
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm turbo run build --filter='@vitalcv/web'

      # Vercel deploy step removed — production deploys via Railway
      # service integration directly from main; this workflow only
      # validates that the build still passes.

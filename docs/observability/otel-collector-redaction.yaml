receivers:
  otlp:
    protocols:
      http:
      grpc:

processors:
  attributes/redact_genai_content:
    actions:
      - key: gen_ai.request.content
        action: delete
      - key: gen_ai.response.content
        action: delete
      - key: gen_ai.tool.input
        action: delete
      - key: llm.prompt
        action: delete
      - key: llm.response
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: enduser.id
        action: hash
      - key: user.email
        action: hash
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlphttp:
    endpoint: ${OBSERVABILITY_BACKEND_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${OBSERVABILITY_BACKEND_TOKEN}"
  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact_genai_content, batch]
      exporters: [otlphttp, logging]

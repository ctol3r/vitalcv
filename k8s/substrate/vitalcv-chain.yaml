# =============================================================================
# VitalCV Substrate Blockchain - Kubernetes Manifests
# =============================================================================
# Components:
#   - Namespace: vitalcv-chain
#   - ConfigMap: chain-config (chain spec, bootnodes)
#   - Secret: validator-keys (SR25519/ED25519 keys)
#   - PVC: validator-data (chain database)
#   - StatefulSet: vitalcv-validator (consensus nodes)
#   - Deployment: vitalcv-rpc (query nodes)
#   - Services: validator-service, rpc-service
#   - Ingress: (commented, for external RPC access)
#
# Pallets: CredentialRegistry, AuditScrapbook, CIT Token, Identity Anchor
# =============================================================================

---
# =============================================================================
# 1. NAMESPACE
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: blockchain

---
# =============================================================================
# 2. CONFIGMAP - Chain Specification & Bootnodes
# =============================================================================
# To update chain spec:
#   kubectl create configmap chain-config -n vitalcv-chain \
#     --from-file=chainSpec.json=/path/to/your/chainSpec.json \
#     --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: chain-config
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: blockchain
data:
  # Chain specification JSON - replace with actual spec
  # Generate with: ./vitalcv-node build-spec --chain=local > chainSpec.json
  chainSpec.json: |
    {
      "name": "VitalCV Network",
      "id": "vitalcv_mainnet",
      "chainType": "Live",
      "bootNodes": [],
      "telemetryEndpoints": [],
      "protocolId": "vcv",
      "properties": {
        "tokenSymbol": "CIT",
        "tokenDecimals": 18
      },
      "genesis": {}
    }

  # Bootnode addresses for peer discovery
  # Format: /dns4/<hostname>/tcp/30333/p2p/<peer-id>
  bootnodes.txt: |
    /dns4/vitalcv-validator-0.validator-headless.vitalcv-chain.svc.cluster.local/tcp/30333/p2p/PEER_ID_HERE
    /dns4/vitalcv-validator-1.validator-headless.vitalcv-chain.svc.cluster.local/tcp/30333/p2p/PEER_ID_HERE

---
# =============================================================================
# 3. SECRET - Validator Keys (Structure Only)
# =============================================================================
# IMPORTANT: Do NOT commit real keys. Use external secrets manager or:
#   kubectl create secret generic validator-keys -n vitalcv-chain \
#     --from-file=aura-0.key=/path/to/validator0/aura.key \
#     --from-file=grandpa-0.key=/path/to/validator0/grandpa.key \
#     --from-file=node-key-0=/path/to/validator0/node-key \
#     --from-file=aura-1.key=/path/to/validator1/aura.key \
#     --from-file=grandpa-1.key=/path/to/validator1/grandpa.key \
#     --from-file=node-key-1=/path/to/validator1/node-key \
#     --from-file=aura-2.key=/path/to/validator2/aura.key \
#     --from-file=grandpa-2.key=/path/to/validator2/grandpa.key \
#     --from-file=node-key-2=/path/to/validator2/node-key
#
# Key types for Substrate PoA:
#   - aura.key: SR25519 for block production
#   - grandpa.key: ED25519 for finality
#   - node-key: ED25519 for libp2p peer identity
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: validator-keys
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
type: Opaque
stringData:
  # PLACEHOLDER - Replace via kubectl or external secrets operator
  # These MUST be replaced before deployment
  aura-0.key: 'REPLACE_WITH_VALIDATOR0_AURA_SR25519_SEED'
  grandpa-0.key: 'REPLACE_WITH_VALIDATOR0_GRANDPA_ED25519_SEED'
  node-key-0: 'REPLACE_WITH_VALIDATOR0_NODE_ED25519_KEY'
  aura-1.key: 'REPLACE_WITH_VALIDATOR1_AURA_SR25519_SEED'
  grandpa-1.key: 'REPLACE_WITH_VALIDATOR1_GRANDPA_ED25519_SEED'
  node-key-1: 'REPLACE_WITH_VALIDATOR1_NODE_ED25519_KEY'
  aura-2.key: 'REPLACE_WITH_VALIDATOR2_AURA_SR25519_SEED'
  grandpa-2.key: 'REPLACE_WITH_VALIDATOR2_GRANDPA_ED25519_SEED'
  node-key-2: 'REPLACE_WITH_VALIDATOR2_NODE_ED25519_KEY'

---
# =============================================================================
# 4. PERSISTENT VOLUME CLAIM - Validator Chain Data
# =============================================================================
# Adjust storage size based on expected chain growth
# VitalCV estimate: ~50GB/year for credential anchors
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validator-data
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
spec:
  accessModes:
    - ReadWriteOnce
  # Change storage class based on cloud provider:
  # AWS EKS: gp3, GKE: standard-rwo, AKS: managed-premium
  storageClassName: standard
  resources:
    requests:
      # Increase for production (recommended: 100Gi+)
      storage: 10Gi

---
# =============================================================================
# 5. STATEFULSET - Validator Node
# =============================================================================
# Validators run consensus (Aura/GRANDPA), produce blocks, anchor credentials
# DO NOT scale horizontally without proper key management
# Each validator needs unique keys registered in chain spec
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vitalcv-validator
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
spec:
  serviceName: validator-headless
  replicas: 3 # Requires per-pod keys (aura-N, grandpa-N, node-key-N)
  selector:
    matchLabels:
      app.kubernetes.io/name: vitalcv
      app.kubernetes.io/component: validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitalcv
        app.kubernetes.io/component: validator
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9615'
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      terminationGracePeriodSeconds: 300 # Allow graceful GRANDPA finalization

      initContainers:
        # Insert validator keys into keystore before node starts
        - name: insert-keys
          # UPDATE: Replace with your actual image
          image: ghcr.io/YOURORG/vitalcv-node:latest
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              ORDINAL="${POD_NAME##*-}"
              echo "Validator ordinal: ${ORDINAL}"

              # Copy per-validator node key into writable volume for `--node-key-file`.
              if [ -f "/keys/node-key-${ORDINAL}" ]; then
                cp "/keys/node-key-${ORDINAL}" "/data/node-key"
                chmod 0400 "/data/node-key"
              else
                echo "Missing node key: /keys/node-key-${ORDINAL}" >&2
                exit 1
              fi

              echo "Inserting Aura key..."
              vitalcv-node key insert \
                --base-path /data \
                --chain /config/chainSpec.json \
                --scheme Sr25519 \
                --suri "$(cat /keys/aura-${ORDINAL}.key)" \
                --key-type aura

              echo "Inserting GRANDPA key..."
              vitalcv-node key insert \
                --base-path /data \
                --chain /config/chainSpec.json \
                --scheme Ed25519 \
                --suri "$(cat /keys/grandpa-${ORDINAL}.key)" \
                --key-type gran

              echo "Keys inserted successfully"
          volumeMounts:
            - name: chain-data
              mountPath: /data
            - name: chain-config
              mountPath: /config
            - name: validator-keys
              mountPath: /keys
              readOnly: true

      containers:
        - name: validator
          # UPDATE: Replace with your actual image
          image: ghcr.io/YOURORG/vitalcv-node:latest
          imagePullPolicy: Always

          args:
            - --chain=/config/chainSpec.json
            - --base-path=/data
            - --validator
            - --name=vitalcv-validator-$(POD_NAME)
            - --node-key-file=/data/node-key
            # P2P settings
            - --port=30333
            - --listen-addr=/ip4/0.0.0.0/tcp/30333
            # RPC settings (internal only for validator)
            - --rpc-port=9933
            - --rpc-external
            - --rpc-cors=all
            - --rpc-methods=Safe
            # WebSocket
            - --ws-port=9944
            - --ws-external
            # Prometheus metrics
            - --prometheus-port=9615
            - --prometheus-external
            # Performance
            - --execution=Wasm
            - --wasm-execution=compiled
            - --state-pruning=archive
            # Telemetry (optional - comment out for privacy)
            # - --telemetry-url=wss://telemetry.vitalcv.io/submit 1

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: 'info,runtime=debug'

          ports:
            - name: p2p
              containerPort: 30333
              protocol: TCP
            - name: rpc
              containerPort: 9933
              protocol: TCP
            - name: ws
              containerPort: 9944
              protocol: TCP
            - name: metrics
              containerPort: 9615
              protocol: TCP

          resources:
            requests:
              cpu: '500m'
              memory: '2Gi'
            limits:
              cpu: '2000m'
              memory: '8Gi'

          # Liveness: Is the node process alive?
          livenessProbe:
            httpGet:
              path: /health
              port: 9933
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          # Readiness: Is the node synced and ready?
          readinessProbe:
            httpGet:
              path: /health
              port: 9933
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: chain-data
              mountPath: /data
            - name: chain-config
              mountPath: /config
              readOnly: true
            - name: validator-keys
              mountPath: /keys
              readOnly: true

      volumes:
        - name: chain-config
          configMap:
            name: chain-config
        - name: validator-keys
          secret:
            secretName: validator-keys
            defaultMode: 0400

  volumeClaimTemplates:
    - metadata:
        name: chain-data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi

---
# =============================================================================
# 6. HEADLESS SERVICE - Validator Discovery (StatefulSet requirement)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: validator-headless
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
  ports:
    - name: p2p
      port: 30333
      targetPort: 30333

---
# =============================================================================
# 7. SERVICE - Validator P2P (External peering)
# =============================================================================
# Change to LoadBalancer or NodePort for external validator peering
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: validator-service
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
  annotations:
    # AWS NLB: service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # GCP: cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP # Change to LoadBalancer for external p2p
  selector:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: validator
  ports:
    - name: p2p
      port: 30333
      targetPort: 30333
      protocol: TCP
    # Expose RPC only if needed (prefer RPC deployment instead)
    # - name: rpc
    #   port: 9933
    #   targetPort: 9933

---
# =============================================================================
# 8. DEPLOYMENT - RPC Node (Stateless, Scalable)
# =============================================================================
# RPC nodes serve queries, don't participate in consensus
# Scale horizontally based on query load
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalcv-rpc
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: rpc
spec:
  replicas: 2 # Adjust based on load
  selector:
    matchLabels:
      app.kubernetes.io/name: vitalcv
      app.kubernetes.io/component: rpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitalcv
        app.kubernetes.io/component: rpc
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9615'
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: rpc
          # UPDATE: Replace with your actual image
          image: ghcr.io/YOURORG/vitalcv-node:latest
          imagePullPolicy: Always

          args:
            - --chain=/config/chainSpec.json
            - --base-path=/data
            # NO --validator flag (this is RPC-only)
            - --name=vitalcv-rpc
            # Bootnodes - connect to validators
            - --bootnodes=/dns4/vitalcv-validator-0.validator-headless.vitalcv-chain.svc.cluster.local/tcp/30333
            # P2P
            - --port=30333
            - --listen-addr=/ip4/0.0.0.0/tcp/30333
            # RPC - external access
            - --rpc-port=9933
            - --rpc-external
            - --rpc-cors=all
            - --rpc-methods=Safe
            - --rpc-max-connections=500
            # WebSocket - external access
            - --ws-port=9944
            - --ws-external
            - --ws-max-connections=500
            # Prometheus
            - --prometheus-port=9615
            - --prometheus-external
            # Performance - RPC nodes can prune aggressively
            - --execution=Wasm
            - --wasm-execution=compiled
            - --state-pruning=256
            - --blocks-pruning=256
            # Sync mode
            - --sync=fast

          env:
            - name: RUST_LOG
              value: 'info'

          ports:
            - name: p2p
              containerPort: 30333
            - name: rpc
              containerPort: 9933
            - name: ws
              containerPort: 9944
            - name: metrics
              containerPort: 9615

          resources:
            requests:
              cpu: '250m'
              memory: '1Gi'
            limits:
              cpu: '1000m'
              memory: '4Gi'

          livenessProbe:
            httpGet:
              path: /health
              port: 9933
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 9933
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: chain-config
              mountPath: /config
              readOnly: true
            - name: rpc-data
              mountPath: /data

      volumes:
        - name: chain-config
          configMap:
            name: chain-config
        # Ephemeral storage for RPC - data can be re-synced
        - name: rpc-data
          emptyDir:
            sizeLimit: 20Gi

---
# =============================================================================
# 9. SERVICE - RPC (Query Access)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rpc-service
  namespace: vitalcv-chain
  labels:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: rpc
spec:
  type: ClusterIP # Change to LoadBalancer for external access
  selector:
    app.kubernetes.io/name: vitalcv
    app.kubernetes.io/component: rpc
  ports:
    - name: rpc
      port: 9933
      targetPort: 9933
      protocol: TCP
    - name: ws
      port: 9944
      targetPort: 9944
      protocol: TCP

---
# =============================================================================
# 10. HORIZONTAL POD AUTOSCALER - RPC Nodes
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitalcv-rpc-hpa
  namespace: vitalcv-chain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vitalcv-rpc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# =============================================================================
# 11. INGRESS - External RPC Access (COMMENTED - Enable as needed)
# =============================================================================
# TLS-terminated external WebSocket/RPC access.
# Requires: ingress-nginx (or similar) + cert-manager (optional but recommended).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitalcv-rpc-ingress
  namespace: vitalcv-chain
  annotations:
    kubernetes.io/ingress.class: nginx
    # Enable WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/upstream-hash-by: '$binary_remote_addr'
    # TLS (cert-manager)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: '100'
spec:
  tls:
    - hosts:
        - rpc.vitalcv.io
        - ws.vitalcv.io
      secretName: vitalcv-rpc-tls
  rules:
    - host: rpc.vitalcv.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rpc-service
                port:
                  number: 9933
    - host: ws.vitalcv.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rpc-service
                port:
                  number: 9944

---
# =============================================================================
# 12. NETWORK POLICY - Restrict Traffic (Security Hardening)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validator-network-policy
  namespace: vitalcv-chain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: validator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow P2P from anywhere (for external validators)
    - ports:
        - port: 30333
          protocol: TCP
    # Allow RPC only from within cluster
    - from:
        - namespaceSelector: {}
      ports:
        - port: 9933
        - port: 9944
    # Allow metrics scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 9615
  egress:
    # Allow all egress (P2P discovery, DNS, etc.)
    - {}

---
# =============================================================================
# 13. POD DISRUPTION BUDGET - High Availability
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vitalcv-rpc-pdb
  namespace: vitalcv-chain
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rpc

---
# =============================================================================
# 14. GRAFANA DASHBOARD (OPTIONAL) - Chain Observability
# =============================================================================
# If you run Grafana with dashboard side-loading, label selector can auto-import.
# This is a minimal placeholder; wire panels to your Prometheus data source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vitalcv-chain-grafana-dashboard
  namespace: vitalcv-chain
  labels:
    grafana_dashboard: '1'
data:
  vitalcv-chain-dashboard.json: |
    {
      "title": "VitalCV Chain (Validators + RPC)",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Block Import (RPC)",
          "targets": [
            { "expr": "substrate_block_height", "legendFormat": "block_height" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Prometheus Scrape (up)",
          "targets": [
            { "expr": "up{namespace=\"vitalcv-chain\"}", "legendFormat": "{{pod}}" }
          ]
        }
      ]
    }

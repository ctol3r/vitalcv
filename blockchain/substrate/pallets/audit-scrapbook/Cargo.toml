[package]
name = "pallet-audit-scrapbook"
version = "4.0.0"
description = "Audit Scrapbook Pallet for VitalCV Trust Ledger"
authors = ["VitalCV Team"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/vitalcv/trust-ledger"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.4.0", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
serde = { version = "1.0", optional = true, default-features = false }

# Substrate
frame-benchmarking = { version = "4.0.0", default-features = false, optional = true }
frame-support = { version = "4.0.0", default-features = false }
frame-system = { version = "4.0.0", default-features = false }
sp-runtime = { version = "7.0.0", default-features = false }
sp-std = { version = "7.0.0", default-features = false }
sp-io = { version = "7.0.0", default-features = false }

[dev-dependencies]
sp-core = { version = "7.0.0", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
]
runtime-benchmarks = ["frame-benchmarking"]
try-runtime = []


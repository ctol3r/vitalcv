# Docker Compose configuration for VitalCV production deployment
# Includes: Next.js app, Redis, health checks, and monitoring

version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vitalcv-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Application
      - NODE_ENV=production
      - NEXT_PUBLIC_ISSUER_URL=${NEXT_PUBLIC_ISSUER_URL:-https://vitalcv.com}

      # Redis
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - REDIS_URL=redis://redis:6379

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Cryptographic Keys (set in .env.production)
      - ISSUER_PRIVATE_KEY=${ISSUER_PRIVATE_KEY}
      - ISSUER_PUBLIC_KEY=${ISSUER_PUBLIC_KEY}

      # Feature Flags
      - ENABLE_STATUS_LIST=${ENABLE_STATUS_LIST:-false}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vitalcv-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for session storage, rate limiting, and caching
  redis:
    image: redis:7-alpine
    container_name: vitalcv-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - vitalcv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Redis Commander (optional, for development/debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vitalcv-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - vitalcv-network
    profiles:
      - debug
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

networks:
  vitalcv-network:
    driver: bridge
    name: vitalcv-network

volumes:
  redis-data:
    driver: local
    name: vitalcv-redis-data
